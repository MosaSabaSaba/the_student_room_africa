<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
        .point-square { fill: #ffffff; }
    </style>

    <!-- Centered Vertical Rectangle Border -->
    <!-- <rect x="150" y="40" width="55" height="60" class="geometry-line" /> -->

    <!-- Square Marker/Point inside the box -->
    <rect x="157" y="78" width="5" height="5" class="point-square" />

    <!-- Letter Label 'B' next to the point -->
    <text x="174" y="84" class="label-text">B</text>
</svg>