<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300">
    <defs>
        <!-- Arrowhead Marker Definition -->
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#ffffff" />
        </marker>
    </defs>
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; }
        .point-dot { fill: #ffffff; }
    </style>

    <!-- LEFT POINT: Youth Hostel -->
    <!-- North Arrow Line -->
    <line x1="80" y1="140" x2="80" y2="40" class="geometry-line" marker-end="url(#arrow)" />
    <!-- North Label -->
    <text x="75" y="32" class="label-text">N</text>
    <!-- Base Point Dot -->
    <circle cx="80" cy="140" r="2.5" class="point-dot" />
    <!-- Location Label -->
    <text x="35" y="144" class="label-text">Youth</text>
    <text x="35" y="158" class="label-text">Hostel</text>


    <!-- RIGHT POINT: Bus Station -->
    <!-- North Arrow Line -->
    <line x1="260" y1="260" x2="260" y2="160" class="geometry-line" marker-end="url(#arrow)" />
    <!-- North Label -->
    <text x="255" y="152" class="label-text">N</text>
    <!-- Base Point Dot -->
    <circle cx="260" cy="260" r="2.5" class="point-dot" />
    <!-- Location Label -->
    <text x="272" y="260" class="label-text">Bus</text>
    <text x="272" y="274" class="label-text">Station</text>
</svg>