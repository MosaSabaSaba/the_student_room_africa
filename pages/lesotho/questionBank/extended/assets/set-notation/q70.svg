<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
    <!-- Background for high contrast -->
    <rect width="100%" height="100%" fill="transparent"/>

    <!-- Main Universal Set Rectangle Boundary -->
    <g stroke="#ffffff" stroke-width="3.5" fill="none">
        <rect x="50" y="40" width="600" height="320" />
    </g>

    <!-- Venn Diagram Set Ellipses (A and B) -->
    <g stroke="#ffffff" stroke-width="3.5" fill="none">
        <!-- Set A: Left Ellipse -->
        <ellipse cx="270" cy="200" rx="170" ry="100" />
        
        <!-- Set B: Right Ellipse -->
        <ellipse cx="430" cy="200" rx="170" ry="100" />
    </g>

    <!-- Text Labels & Values Descriptions -->
    <g font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff">
        <!-- Set Names Labels -->
        <text x="70" y="80" font-size="32">ε</text>
        <text x="240" y="85" font-size="28" text-anchor="middle" font-style="italic">A</text>
        <text x="460" y="85" font-size="28" text-anchor="middle" font-style="italic">B</text>

        <!-- Intersection Region Numerical Values -->
        <!-- Top intersection value -->
        <text x="350" y="145" font-size="28" text-anchor="middle">6</text>
        
        <!-- Bottom intersection value -->
        <text x="350" y="275" font-size="28" text-anchor="middle">8</text>
    </g>
</svg>