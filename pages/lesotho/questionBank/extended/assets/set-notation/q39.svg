<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180">
    <style>
        .diagram-border { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .set-ellipse { stroke: #ffffff; stroke-width: 1.2; fill: none; }
        .label-text { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 16px; font-weight: bold; fill: #ffffff; }
        .value-text { font-family: Arial, sans-serif; font-size: 14px; fill: #ffffff; }
        .dots-text { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; letter-spacing: 0.5px; }
    </style>

    <!-- Universal Set Box Border -->
    <rect x="15" y="10" width="350" height="160" class="diagram-border" />

    <!-- Three Intersecting Set Ellipses -->
    <!-- Set S (Top Left) -->
    <ellipse cx="140" cy="75" rx="65" ry="45" class="set-ellipse" />
    
    <!-- Set E (Top Right) -->
    <ellipse cx="225" cy="85" rx="55" ry="42" class="set-ellipse" />
    
    <!-- Set P (Bottom Center) -->
    <ellipse cx="180" cy="115" rx="55" ry="38" class="set-ellipse" />

    <!-- Set Identifiers (S, E, P) -->
    <text x="63" y="44" class="label-text">S</text>
    <text x="282" y="54" class="label-text">E</text>
    <text x="115" y="152" class="label-text">P</text>

    <!-- Region Values & Blank Space Placeholders (....) -->
    <!-- Only in S -->
    <text x="100" y="80" class="value-text" text-anchor="middle">12</text>
    
    <!-- Only in E -->
    <text x="255" y="90" class="dots-text" text-anchor="middle">....</text>
    
    <!-- Only in P -->
    <text x="180" y="142" class="value-text" text-anchor="middle">18</text>
    
    <!-- Outside all sets -->
    <text x="338" y="90" class="value-text" text-anchor="middle">2</text>

    <!-- Intersection Regions -->
    <!-- S intersect E (excluding P) -->
    <text x="192" y="68" class="dots-text" text-anchor="middle">....</text>
    
    <!-- S intersect P (excluding E) -->
    <text x="142" y="112" class="dots-text" text-anchor="middle">....</text>
    
    <!-- E intersect P (excluding S) -->
    <text x="220" y="115" class="value-text" text-anchor="middle">7</text>
    
    <!-- Triple Intersection (S intersect E intersect P) -->
    <text x="182" y="94" class="value-text" text-anchor="middle">3</text>
</svg>