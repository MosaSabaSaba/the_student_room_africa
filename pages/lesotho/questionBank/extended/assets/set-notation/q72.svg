<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
    <!-- Background for high contrast -->
    <rect width="100%" height="100%" fill="transparent"/>

    <!-- Main Universal Set Rectangle Boundary -->
    <g stroke="#ffffff" stroke-width="3.5" fill="none">
        <rect x="50" y="40" width="600" height="370" />
    </g>

    <!-- Venn Diagram Set Ellipses (F, J, M) -->
    <g stroke="#ffffff" stroke-width="3.5" fill="none">
        <!-- Set F: Left Ellipse -->
        <ellipse cx="260" cy="180" rx="145" ry="90" />
        
        <!-- Set J: Right Ellipse -->
        <ellipse cx="440" cy="180" rx="145" ry="90" />
        
        <!-- Set M: Bottom Center Ellipse -->
        <ellipse cx="390" cy="245" rx="145" ry="85" />
    </g>

    <!-- Text Labels & Values Descriptions -->
    <g font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff">
        <!-- Set Names Labels -->
        <text x="70" y="80" font-size="32">ε</text>
        <text x="260" y="75" font-size="26" text-anchor="middle" font-style="italic">F</text>
        <text x="470" y="75" font-size="26" text-anchor="middle" font-style="italic">J</text>
        <text x="540" y="325" font-size="26" text-anchor="middle" font-style="italic">M</text>

        <!-- Region Numerical Values -->
        <!-- Only F region -->
        <text x="180" y="185" font-size="28" text-anchor="middle">10</text>
        
        <!-- Only J region -->
        <text x="490" y="160" font-size="28" text-anchor="middle">8</text>
        
        <!-- Only M region -->
        <text x="440" y="310" font-size="28" text-anchor="middle">5</text>
        
        <!-- Intersection of F and J, outside M -->
        <text x="350" y="145" font-size="28" text-anchor="middle">2</text>
        
        <!-- Intersection of F and M, outside J -->
        <text x="310" y="245" font-size="28" text-anchor="middle">7</text>
        
        <!-- Intersection of J and M, outside F -->
        <text x="465" y="240" font-size="28" text-anchor="middle">4</text>
        
        <!-- Intersection of F, J, and M (Center) -->
        <text x="385" y="210" font-size="28" text-anchor="middle">1</text>
        
        <!-- Universal set remainder variable (Outside all loops) -->
        <text x="460" y="375" font-size="28" text-anchor="middle" font-style="italic">y</text>
    </g>
</svg>