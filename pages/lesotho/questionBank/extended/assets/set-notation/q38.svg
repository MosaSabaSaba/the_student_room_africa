<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180">
    <style>
        .diagram-border { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .set-ellipse { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; }
        .variable-text { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 15px; fill: #ffffff; }
    </style>

    <!-- Universal Set Box Border -->
    <rect x="25" y="20" width="310" height="140" class="diagram-border" />

    <!-- Two Intersecting Ellipses -->
    <!-- Set A (Left Ellipse) -->
    <ellipse cx="135" cy="90" rx="65" ry="38" class="set-ellipse" />
    
    <!-- Set B (Right Ellipse) -->
    <ellipse cx="215" cy="90" rx="65" ry="38" class="set-ellipse" />

    <!-- Set Labels -->
    <text x="11" y="28" class="variable-text">ξ</text>
    <text x="130" y="44" class="label-text" text-anchor="middle">A</text>
    <text x="215" y="44" class="label-text" text-anchor="middle">B</text>

    <!-- Region Variable Values -->
    <!-- Only in A -->
    <text x="105" y="95" class="variable-text" text-anchor="middle">p</text>
    
    <!-- Intersection (A and B) -->
    <text x="175" y="95" class="variable-text" text-anchor="middle">x</text>
    
    <!-- Only in B -->
    <text x="245" y="112" class="variable-text" text-anchor="middle">q</text>
    
    <!-- Outside both sets (Complement) -->
    <text x="312" y="132" class="variable-text" text-anchor="middle">y</text>
</svg>