<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
        .note-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; letter-spacing: 0.5px; }
    </style>

    <!-- "NOT TO SCALE" Note -->
    <text x="280" y="45" class="note-text">NOT TO</text>
    <text x="280" y="60" class="note-text">SCALE</text>

    <!-- Straight Bottom Line ABCD -->
    <line x1="60" y1="150" x2="260" y2="150" class="geometry-line" />

    <!-- Left Polygon (9-sided Nonagon) -->
    <!-- Vertices: A(65,150), B(115,150), X(150,115), Y(155,75) ... -->
    <polygon points="65,150 115,150 150,115 155,75 130,40 90,30 55,45 35,80 42,122" class="geometry-line" />

    <!-- Right Polygon (6-sided Hexagon) -->
    <!-- Shares side XY, vertices: X(150,115), Y(155,75), Top(195,55), Right(228,88), E(218,132), C(178,150) -->
    <polygon points="150,115 155,75 195,55 228,88 218,132 178,150" class="geometry-line" />

    <!-- Letter Labels for Points and Vertices -->
    <text x="50" y="165" class="label-text">A</text>
    <text x="105" y="165" class="label-text">B</text>
    <text x="175" y="165" class="label-text">C</text>
    <text x="245" y="165" class="label-text">D</text>
    <text x="153" y="116" class="label-text">X</text>
    <text x="153" y="70" class="label-text">Y</text>
    <text x="222" y="140" class="label-text">E</text>
</svg>