<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .axis-line { stroke: #ffffff; stroke-width: 1.2; fill: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; }
        .note-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; letter-spacing: 0.5px; }
    </style>

    <!-- Definitions for Arrowheads -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 2 L 8 5 L 0 8 z" fill="#ffffff" />
        </marker>
    </defs>

    <!-- "NOT TO SCALE" Note -->
    <text x="296" y="70" class="note-text">NOT TO</text>
    <text x="296" y="85" class="note-text">SCALE</text>

    <!-- Coordinate Axes -->
    <!-- X Axis -->
    <line x1="30" y1="130" x2="250" y2="130" class="axis-line" marker-end="url(#arrow)" />
    <text x="255" y="135" class="label-text">x</text>
    
    <!-- Y Axis -->
    <line x1="100" y1="175" x2="100" y2="25" class="axis-line" marker-end="url(#arrow)" />
    <text x="90" y="25" class="label-text">y</text>

    <!-- Geometry Lines -->
    <!-- Line segment AC passing through N -->
    <line x1="70" y1="170" x2="165" y2="55" class="geometry-line" />
    
    <!-- Line segment CB -->
    <line x1="165" y1="55" x2="230" y2="75" class="geometry-line" />
    
    <!-- Line segment AB passing through M -->
    <line x1="70" y1="170" x2="230" y2="75" class="geometry-line" />
    
    <!-- Inner line segment NM -->
    <line x1="120" y1="112" x2="145" y2="125" class="geometry-line" />

    <!-- Points (Dots) -->
    <circle cx="70" cy="170" r="2.5" fill="#ffffff" />
    <circle cx="120" cy="112" r="2.5" fill="#ffffff" />
    <circle cx="165" cy="55" r="2.5" fill="#ffffff" />
    <circle cx="145" cy="125" r="2.5" fill="#ffffff" />
    <circle cx="230" cy="75" r="2.5" fill="#ffffff" />

    <!-- Labels for Points -->
    <text x="22" y="174" class="label-text">A(-2,−4)</text>
    <text x="92" y="105" class="label-text">N(2,2)</text>
    <text x="133" y="52" class="label-text">C(6,8)</text>
    <text x="150" y="132" class="label-text">M</text>
    <text x="255" y="80" class="label-text">B(12,6)</text>
</svg>