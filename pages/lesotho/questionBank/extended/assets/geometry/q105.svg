<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" width="340" height="240">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
        .degree-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; }
        .note-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; letter-spacing: 0.5px; }
    </style>

    <!-- "NOT TO SCALE" Note -->
    <text x="260" y="35" class="note-text">NOT TO</text>
    <text x="260" y="50" class="note-text">SCALE</text>

    <!-- Main Polygon Lines -->
    <!-- Side AB -->
    <line x1="45" y1="165" x2="40" y2="80" class="geometry-line" />
    
    <!-- Side BC -->
    <line x1="40" y1="80" x2="130" y2="30" class="geometry-line" />
    
    <!-- Side CD -->
    <line x1="130" y1="30" x2="205" y2="190" class="geometry-line" />
    
    <!-- Base Line ADE (Straight line from A through D to E) -->
    <line x1="45" y1="165" x2="265" y2="197.5" class="geometry-line" />

    <!-- Angle Arc at B (x + y)° -->
    <path d="M 42 110 A 30 30 0 0 0 67 65" class="geometry-line" />
    <text x="48" y="92" class="degree-text">(x + y)°</text>

    <!-- Angle Arc at D (2x + 10)° -->
    <path d="M 201 160 A 30 30 0 0 1 245 194" class="geometry-line" />
    <text x="212" y="180" class="degree-text">(2x + 10)°</text>

    <!-- Letter Labels for Vertices -->
    <text x="32" y="175" class="label-text">A</text>
    <text x="23" y="80" class="label-text">B</text>
    <text x="127" y="22" class="label-text">C</text>
    <text x="202" y="206" class="label-text">D</text>
    <text x="262" y="213" class="label-text">E</text>
</svg>