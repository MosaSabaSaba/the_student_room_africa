<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340">
    <style>
        .axis-line { stroke: #ffffff; stroke-width: 2; fill: none; }
        .geometry-line { stroke: #ffffff; stroke-width: 1.8; fill: none; stroke-linejoin: round; }
        .dashed-line { stroke: #ffffff; stroke-width: 1.5; fill: none; stroke-dasharray: 4,4; }
        .label-text { font-family: Arial, sans-serif; font-size: 13px; fill: #ffffff; }
        .bold-label { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
        .variable-text { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 15px; font-weight: bold; fill: #ffffff; }
    </style>

    <defs>
        <!-- Axis Arrowhead definition -->
        <marker id="axis-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#ffffff" stroke="none" />
        </marker>
    </defs>

    <!-- Boundary Inequality / Constraint Lines -->
    <!-- Downward Sloping Outer Line (intercepts: y=80, x=80) -->
    <line x1="60" y1="90" x2="340" y2="270" class="geometry-line" />
    
    <!-- Downward Sloping Inner Line (intercepts: y=60, x=60) -->
    <line x1="60" y1="135" x2="270" y2="270" class="geometry-line" />
    
    <!-- Horizontal Line at y=40 -->
    <line x1="60" y1="180" x2="340" y2="180" class="geometry-line" />
    
    <!-- Vertical Line at x=50 -->
    <line x1="235" y1="50" x2="235" y2="270" class="geometry-line" />

    <!-- Dashed Projection / Trace Lines -->
    <!-- Dashed extension horizontally across from y=40 region -->
    <line x1="130" y1="180" x2="200" y2="180" class="dashed-line" />
    
    <!-- Dashed or small solid drop vertical marker line at x=50 to the inner slope -->
    <line x1="235" y1="225" x2="235" y2="270" class="geometry-line" stroke-width="1.2" />

    <!-- Main Coordinate Axes -->
    <!-- X-Axis -->
    <line x1="30" y1="270" x2="385" y2="270" class="axis-line" marker-start="url(#axis-arrow)" marker-end="url(#axis-arrow)" />
    <!-- Y-Axis -->
    <line x1="60" y1="295" x2="60" y2="35" class="axis-line" marker-start="url(#axis-arrow)" marker-end="url(#axis-arrow)" />

    <!-- Tick Marks on X-axis -->
    <line x1="130" y1="267" x2="130" y2="273" class="axis-line" stroke-width="1" />
    <line x1="200" y1="267" x2="200" y2="273" class="axis-line" stroke-width="1" />
    <line x1="235" y1="267" x2="235" y2="273" class="axis-line" stroke-width="1" />
    <line x1="270" y1="267" x2="270" y2="273" class="axis-line" stroke-width="1" />
    <line x1="340" y1="267" x2="340" y2="273" class="axis-line" stroke-width="1" />

    <!-- Tick Marks on Y-axis -->
    <line x1="57" y1="225" x2="63" y2="225" class="axis-line" stroke-width="1" />
    <line x1="57" y1="180" x2="63" y2="180" class="axis-line" stroke-width="1" />
    <line x1="57" y1="135" x2="63" y2="135" class="axis-line" stroke-width="1" />
    <line x1="57" y1="90" x2="63" y2="90" class="axis-line" stroke-width="1" />

    <!-- X-Axis Numerical Labels -->
    <text x="48" y="285" class="label-text" text-anchor="middle">0</text>
    <text x="130" y="288" class="label-text" text-anchor="middle">20</text>
    <text x="200" y="288" class="label-text" text-anchor="middle">40</text>
    <!-- <text x="235" y="288" class="label-text" text-anchor="middle">60</text> -->
    <text x="270" y="288" class="label-text" text-anchor="middle">60</text>
    <text x="340" y="288" class="label-text" text-anchor="middle">80</text>

    <!-- Y-Axis Numerical Labels -->
    <text x="50" y="230" class="label-text" text-anchor="end">20</text>
    <text x="50" y="185" class="label-text" text-anchor="end">40</text>
    <text x="50" y="140" class="label-text" text-anchor="end">60</text>
    <text x="50" y="95" class="label-text" text-anchor="end">80</text>

    <!-- Axis Variables -->
    <text x="395" y="275" class="variable-text">x</text>
    <text x="60" y="25" class="variable-text" text-anchor="middle">y</text>

    <!-- Scale Disclaimer Text -->
    <text x="420" y="85" class="bold-label">NOT TO SCALE</text>
</svg>