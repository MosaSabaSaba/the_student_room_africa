<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240">
    <style>
        .grid-line-major { stroke: #ffffff; stroke-width: 1.0; opacity: 0.4; fill: none; }
        .grid-line-minor { stroke: #ffffff; stroke-width: 0.5; opacity: 0.2; fill: none; }
        .axis-line { stroke: #ffffff; stroke-width: 1.8; fill: none; }
        .geometry-line { stroke: #ffffff; stroke-width: 2.0; fill: none; stroke-linecap: round; }
        .label-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
        .math-text { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 13px; font-weight: bold; fill: #ffffff; }
    </style>

    <!-- Shaded Region perfectly mapped to meet at exactly (2.9, 3) -->
    <!-- Bounds: (0,0) -> (0,2) -> (2.9,3) -> (7.25,0) -->
    <polygon points="40,190 40,138 115.4,112 228.5,190" fill="#ffffff" fill-opacity="1" />

    <!-- FINE-GRAINED GRID CHANNELS -->
    <!-- Vertical Grid Lines (0 to 8 with 0.5 subdivisions) -->
    <g class="grid-line-minor">
        <line x1="53" y1="34" x2="53" y2="190" />
        <line x1="79" y1="34" x2="79" y2="190" />
        <line x1="105" y1="34" x2="105" y2="190" />
        <line x1="131" y1="34" x2="131" y2="190" />
        <line x1="157" y1="34" x2="157" y2="190" />
        <line x1="183" y1="34" x2="183" y2="190" />
        <line x1="209" y1="34" x2="209" y2="190" />
        <line x1="235" y1="34" x2="235" y2="190" />
    </g>
    <g class="grid-line-major">
        <line x1="66" y1="34" x2="66" y2="190" />
        <line x1="92" y1="34" x2="92" y2="190" />
        <line x1="118" y1="34" x2="118" y2="190" />
        <line x1="144" y1="34" x2="144" y2="190" />
        <line x1="170" y1="34" x2="170" y2="190" />
        <line x1="196" y1="34" x2="196" y2="190" />
        <line x1="222" y1="34" x2="222" y2="190" />
        <line x1="248" y1="34" x2="248" y2="190" />
    </g>

    <!-- Horizontal Grid Lines (0 to 6 with 0.5 subdivisions) -->
    <g class="grid-line-minor">
        <line x1="40" y1="177" x2="248" y2="177" />
        <line x1="40" y1="151" x2="248" y2="151" />
        <line x1="40" y1="125" x2="248" y2="125" />
        <line x1="40" y1="99" x2="248" y2="99" />
        <line x1="40" y1="73" x2="248" y2="73" />
        <line x1="40" y1="47" x2="248" y2="47" />
    </g>
    <g class="grid-line-major">
        <line x1="40" y1="164" x2="248" y2="164" />
        <line x1="40" y1="138" x2="248" y2="138" />
        <line x1="40" y1="112" x2="248" y2="112" />
        <line x1="40" y1="86" x2="248" y2="86" />
        <line x1="40" y1="60" x2="248" y2="60" />
        <line x1="40" y1="34" x2="248" y2="34" />
    </g>

    <!-- COORDINATE AXES -->
    <!-- X-Axis -->
    <line x1="40" y1="190" x2="265" y2="190" class="axis-line" />
    <path d="M 260 186 L 267 190 L 260 194" class="axis-line" />
    <text x="277" y="194" class="math-text">x</text>

    <!-- Y-Axis -->
    <line x1="40" y1="190" x2="40" y2="20" class="axis-line" />
    <path d="M 36 25 L 40 18 L 44 25" class="axis-line" />

    <!-- GRAPH LINES -->
    <!-- Downward Line: Passing precisely through (0,5) and intersection (2.9,3) -->
    <line x1="40" y1="60" x2="228.5" y2="190" class="geometry-line" />
    
    <!-- Upward Line: Passing precisely through (0,2) and intersection (2.9,3) -->
    <line x1="40" y1="138" x2="248" y2="66.3" class="geometry-line" />

    <!-- AXIS LABELS AND TICKS -->
    <!-- X-Axis Labels -->
    <text x="40" y="205" class="label-text">0</text>
    <text x="66" y="205" class="label-text">1</text>
    <text x="92" y="205" class="label-text">2</text>
    <text x="118" y="205" class="label-text">3</text>
    <text x="144" y="205" class="label-text">4</text>
    <text x="170" y="205" class="label-text">5</text>
    <text x="196" y="205" class="label-text">6</text>
    <text x="222" y="205" class="label-text">7</text>
    <text x="248" y="205" class="label-text">8</text>

    <!-- Y-Axis Labels -->
    <text x="28" y="167" class="label-text">1</text>
    <text x="28" y="141" class="label-text">2</text>
    <text x="28" y="115" class="label-text">3</text>
    <text x="28" y="89" class="label-text">4</text>
    <text x="28" y="63" class="label-text">5</text>
    <text x="28" y="37" class="label-text">6</text>
</svg>