<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 2.0; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .tick-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
    </style>

    <!-- Main Straight Number Line (From x=30 to x=310) -->
    <line x1="30" y1="50" x2="310" y2="50" class="geometry-line" />

    <!-- Left Arrow Head (Explicitly drawn facing LEFT) -->
    <path d="M 42 43 L 30 50 L 42 57" class="geometry-line" />

    <!-- Right Arrow Head (Explicitly drawn facing RIGHT) -->
    <path d="M 298 43 L 310 50 L 298 57" class="geometry-line" />

    <!-- 7 Evenly Spaced Vertical Tick Marks -->
    <line x1="65" y1="42" x2="65" y2="58" class="tick-line" />
    <line x1="100" y1="42" x2="100" y2="58" class="tick-line" />
    <line x1="135" y1="42" x2="135" y2="58" class="tick-line" />
    <line x1="170" y1="42" x2="170" y2="58" class="tick-line" />
    <line x1="205" y1="42" x2="205" y2="58" class="tick-line" />
    <line x1="240" y1="42" x2="240" y2="58" class="tick-line" />
    <line x1="275" y1="42" x2="275" y2="58" class="tick-line" />
</svg>