<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="420" height="240">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; stroke-linejoin: round; }
        .shaded-area { fill: #555555; stroke: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
        .value-text { font-family: Arial, sans-serif; font-size: 12px; fill: #ffffff; }
    </style>

    <!-- Definitions for Double-Headed Dimension Arrow -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#ffffff" stroke="none" />
        </marker>
    </defs>

    <!-- Shaded Region (Bounded by AM, AP, and Arc PM) -->
    <path d="M 173.4 210 L 216.7 135 A 50 50 0 0 0 260 210 Z" class="shaded-area" />

    <!-- Main Triangle ABC -->
    <line x1="173.4" y1="210" x2="346.6" y2="210" class="geometry-line" />
    <line x1="173.4" y1="210" x2="260" y2="60" class="geometry-line" />
    <line x1="260" y1="60" x2="346.6" y2="210" class="geometry-line" />

    <!-- Inscribed Circle -->
    <circle cx="260" cy="160" r="50" class="geometry-line" />

    <!-- Radius OM -->
    <line x1="260" y1="160" x2="260" y2="210" class="geometry-line" />

    <!-- Center Point O -->
    <circle cx="260" cy="160" r="3" fill="#ffffff" />

    <!-- Dimension Arrow for Side Length (14 cm) -->
    <line x1="138.8" y1="190" x2="225.4" y2="40" class="geometry-line" marker-start="url(#arrow)" marker-end="url(#arrow)" />

    <!-- Letter Labels for Vertices and Tangent Points -->
    <text x="158" y="222" class="label-text">A</text>
    <text x="254" y="52" class="label-text">B</text>
    <text x="352" y="222" class="label-text">C</text>
    <text x="255" y="222" class="label-text">M</text>
    <text x="200" y="132" class="label-text">P</text>
    <text x="310" y="135" class="label-text">T</text>
    <text x="254" y="150" class="label-text">0</text>

    <!-- Measurement Values -->
    <text x="266" y="190" class="value-text">4 cm</text>
    <text x="175" y="112" class="value-text" transform="rotate(-60, 175, 112)" text-anchor="middle">14 cm</text>
</svg>