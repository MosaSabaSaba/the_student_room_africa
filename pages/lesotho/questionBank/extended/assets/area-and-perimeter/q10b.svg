<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; stroke-linejoin: round; }
        .dashed-line { stroke: #ffffff; stroke-width: 1.5; fill: none; stroke-dasharray: 4,4; stroke-linejoin: round; }
        .label-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
    </style>

    <!-- Hidden Back Edges (Dashed) -->
    <!-- Edge DC -->
    <line x1="45" y1="180" x2="110" y2="165" class="dashed-line" />
    <!-- Edge CB -->
    <line x1="110" y1="165" x2="205" y2="175" class="dashed-line" />
    <!-- Slant Edge AC -->
    <line x1="135" y1="30" x2="110" y2="165" class="dashed-line" />

    <!-- Visible Solid Edges -->
    <!-- Base Edge DE -->
    <line x1="45" y1="180" x2="145" y2="195" class="geometry-line" />
    <!-- Base Edge EB -->
    <line x1="145" y1="195" x2="205" y2="175" class="geometry-line" />
    
    <!-- Slant Edge AD -->
    <line x1="135" y1="30" x2="45" y2="180" class="geometry-line" />
    <!-- Slant Edge AE -->
    <line x1="135" y1="30" x2="145" y2="195" class="geometry-line" />
    <!-- Slant Edge AB -->
    <line x1="135" y1="30" x2="205" y2="175" class="geometry-line" />

    <!-- Vertex Labels -->
    <text x="130" y="22" class="label-text">A</text>
    <text x="210" y="178" class="label-text">B</text>
    <text x="114" y="162" class="label-text">C</text>
    <text x="30" y="185" class="label-text">D</text>
    <text x="140" y="210" class="label-text">E</text>
    
    <!-- Notice Text -->
    <text x="290" y="45" class="label-text">NOT TO</text>
    <text x="290" y="61" class="label-text">SCALE</text>
</svg>