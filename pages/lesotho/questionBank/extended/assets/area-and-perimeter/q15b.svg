<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 220">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; stroke-linejoin: round; }
        .label-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
        .value-text { font-family: Arial, sans-serif; font-size: 12px; fill: #ffffff; }
        .angle-text { font-family: Arial, sans-serif; font-size: 11px; fill: #ffffff; }
        .variable-text { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 13px; font-weight: bold; fill: #ffffff; }
    </style>

    <!-- Outer Triangle and Main Infrastructure -->
    <!-- Base Line (Left X to Bottom-Right C) -->
    <line x1="50" y1="185" x2="340" y2="195" class="geometry-line" />
    
    <!-- Left Outer Slant XY -->
    <line x1="50" y1="185" x2="160" y2="35" class="geometry-line" />
    
    <!-- Right Outer Slant YC -->
    <line x1="160" y1="35" x2="340" y2="195" class="geometry-line" />

    <!-- Interior Structural Lines connected to Central Point C -->
    <!-- Vertical Height YC -->
    <line x1="160" y1="35" x2="160" y2="115" class="geometry-line" stroke-width="1.8" />
    
    <!-- Internal Ray XC -->
    <line x1="50" y1="185" x2="160" y2="115" class="geometry-line" />
    
    <!-- Internal Ray CC -->
    <line x1="160" y1="115" x2="340" y2="195" class="geometry-line" />

    <!-- Perpendicular Right-Angle Indicators at Central Vertex C -->
    <!-- Left Right-Angle Box -->
    <path d="M 148 120 L 148 107 L 160 107" class="geometry-line" stroke-width="1.2" />
    <!-- Right Right-Angle Box -->
    <path d="M 172 120 L 172 109 L 160 104" class="geometry-line" stroke-width="1.2" />

    <!-- Corrected Angle Arcs to precisely match the image -->
    <!-- Upper Angle at X: between XY and Internal Ray XC (labeled 25°) -->
    <path d="M 96 126 A 40 40 0 0 1 110 145" class="geometry-line" stroke-width="1" />
    
    <!-- Lower Angle at X: between Internal Ray XC and Base Line (unlabeled arc) -->
    <path d="M 89 159 A 40 40 0 0 1 97 187" class="geometry-line" stroke-width="1" />
    
    <!-- Angle at Bottom-Right C: between Right Outer Slant YC and Internal Ray CC (labeled θ°) -->
    <path d="M 280 169 A 50 50 0 0 1 290 151" class="geometry-line" stroke-width="1" />

    <!-- Structural Letter Labels (reproducing both 'C' labels exactly as shown) -->
    <text x="32" y="193" class="label-text">X</text>
    <text x="156" y="24" class="label-text">Y</text>
    <text x="163" y="128" class="label-text">C</text>
    <text x="345" y="202" class="label-text">C</text>

    <!-- Technical / Measurement Value Labels -->
    <text x="168" y="78" class="value-text">16cm</text>
    <text x="88" y="148" class="angle-text">25°</text>
    <text x="290" y="170" class="variable-text">θ°</text>
    
    <!-- Scale Notice -->
    <text x="375" y="80" class="label-text">NOT TO</text>
    <text x="375" y="96" class="label-text">SCALE</text>
</svg>