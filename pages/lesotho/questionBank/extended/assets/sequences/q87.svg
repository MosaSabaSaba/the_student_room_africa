<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%">
    <!-- White Background -->
    <rect width="100%" height="100%" fill="transparent" />

    <!-- Styles for crisp lines and text -->
    <style>
        .grid-line { stroke: #ffffff; stroke-width: 1.5; stroke-linecap: round; }
        .dot { fill: #ffffff; }
        .label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; fill: #ffffff; text-anchor: middle; }
    </style>

    <!-- ================= DIAGRAM 1 ================= -->
    <g id="diagram-1">
        <!-- Grid Lines -->
        <line x1="50" y1="80" x2="80" y2="80" class="grid-line" />
        <line x1="50" y1="110" x2="80" y2="110" class="grid-line" />
        <line x1="50" y1="80" x2="50" y2="110" class="grid-line" />
        <line x1="80" y1="80" x2="80" y2="110" class="grid-line" />
        
        <!-- Dots (Vertices) -->
        <circle cx="50" cy="80" r="2.5" class="dot" />
        <circle cx="80" cy="80" r="2.5" class="dot" />
        <circle cx="50" cy="110" r="2.5" class="dot" />
        <circle cx="80" cy="110" r="2.5" class="dot" />
        
        <!-- Label -->
        <text x="65" y="140" class="label">Diagram 1</text>
    </g>

    <!-- ================= DIAGRAM 2 ================= -->
    <g id="diagram-2">
        <!-- Horizontal Lines -->
        <line x1="180" y1="50" x2="240" y2="50" class="grid-line" />
        <line x1="180" y1="80" x2="240" y2="80" class="grid-line" />
        <line x1="180" y1="110" x2="240" y2="110" class="grid-line" />
        
        <!-- Vertical Lines -->
        <line x1="180" y1="50" x2="180" y2="110" class="grid-line" />
        <line x1="210" y1="50" x2="210" y2="110" class="grid-line" />
        <line x1="240" y1="50" x2="240" y2="110" class="grid-line" />
        
        <!-- Dots (Vertices) -->
        <circle cx="180" cy="50" r="2.5" class="dot" />
        <circle cx="210" cy="50" r="2.5" class="dot" />
        <circle cx="240" cy="50" r="2.5" class="dot" />
        <circle cx="180" cy="80" r="2.5" class="dot" />
        <circle cx="210" cy="80" r="2.5" class="dot" />
        <circle cx="240" cy="80" r="2.5" class="dot" />
        <circle cx="180" cy="110" r="2.5" class="dot" />
        <circle cx="210" cy="110" r="2.5" class="dot" />
        <circle cx="240" cy="110" r="2.5" class="dot" />
        
        <!-- Label -->
        <text x="210" y="140" class="label">Diagram 2</text>
    </g>

    <!-- ================= DIAGRAM 3 ================= -->
    <g id="diagram-3">
        <!-- Horizontal Lines -->
        <line x1="360" y1="20" x2="450" y2="20" class="grid-line" />
        <line x1="360" y1="50" x2="450" y2="50" class="grid-line" />
        <line x1="360" y1="80" x2="450" y2="80" class="grid-line" />
        <line x1="360" y1="110" x2="450" y2="110" class="grid-line" />
        
        <!-- Vertical Lines -->
        <line x1="360" y1="20" x2="360" y2="110" class="grid-line" />
        <line x1="390" y1="20" x2="390" y2="110" class="grid-line" />
        <line x1="420" y1="20" x2="420" y2="110" class="grid-line" />
        <line x1="450" y1="20" x2="450" y2="110" class="grid-line" />
        
        <!-- Dots (Vertices) -->
        <circle cx="360" cy="20" r="2.5" class="dot" />
        <circle cx="390" cy="20" r="2.5" class="dot" />
        <circle cx="420" cy="20" r="2.5" class="dot" />
        <circle cx="450" cy="20" r="2.5" class="dot" />
        
        <circle cx="360" cy="50" r="2.5" class="dot" />
        <circle cx="390" cy="50" r="2.5" class="dot" />
        <circle cx="420" cy="50" r="2.5" class="dot" />
        <circle cx="450" cy="50" r="2.5" class="dot" />
        
        <circle cx="360" cy="80" r="2.5" class="dot" />
        <circle cx="390" cy="80" r="2.5" class="dot" />
        <circle cx="420" cy="80" r="2.5" class="dot" />
        <circle cx="450" cy="80" r="2.5" class="dot" />
        
        <circle cx="360" cy="110" r="2.5" class="dot" />
        <circle cx="390" cy="110" r="2.5" class="dot" />
        <circle cx="420" cy="110" r="2.5" class="dot" />
        <circle cx="450" cy="110" r="2.5" class="dot" />
        
        <!-- Label -->
        <text x="405" y="140" class="label">Diagram 3</text>
    </g>
</svg>