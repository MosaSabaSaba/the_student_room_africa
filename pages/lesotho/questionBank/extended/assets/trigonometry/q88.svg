<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
        .degree-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; }
        .note-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; letter-spacing: 0.5px; }
    </style>

    <!-- "NOT TO SCALE" Note -->
    <text x="285" y="35" class="note-text">NOT TO</text>
    <text x="285" y="50" class="note-text">SCALE</text>

    <!-- Horizontal Ground Baseline Line H-C-G-E -->
    <line x1="25" y1="145" x2="280" y2="145" class="geometry-line" />

    <!-- Left Vertical Wall/Line BH -->
    <line x1="25" y1="35" x2="25" y2="145" class="geometry-line" />

    <!-- Slanted Line BC -->
    <line x1="25" y1="35" x2="115" y2="145" class="geometry-line" />

    <!-- Slanted Line CD -->
    <line x1="115" y1="145" x2="225" y2="70" class="geometry-line" />

    <!-- Right Interior Vertical Line DG -->
    <line x1="225" y1="70" x2="225" y2="145" class="geometry-line" />

    <!-- Slanted Line DE -->
    <line x1="225" y1="70" x2="280" y2="145" class="geometry-line" />

    <!-- Angle Arcs and Text Labels -->
    <!-- 32 Degree Arc at Vertex C -->
    <path d="M 139 145 A 24 24 0 0 0 135 131" class="geometry-line" />
    <text x="127" y="140" class="degree-text">32&#176;</text>

    <!-- Dimension/Side Length Text Labels -->
    <text x="70" y="80" class="degree-text">80 cm</text>
    <text x="60" y="157" class="degree-text">60 cm</text>
    <text x="200" y="112" class="degree-text">40 cm</text>
    <text x="240" y="157" class="degree-text">35 cm</text>

    <!-- Letter Labels for Vertices -->
    <text x="21" y="29" class="label-text">B</text>
    <text x="21" y="158" class="label-text">H</text>
    <text x="111" y="158" class="label-text">C</text>
    <text x="221" y="64" class="label-text">D</text>
    <text x="221" y="158" class="label-text">G</text>
    <text x="283" y="154" class="label-text">E</text>
</svg>