<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="100%" height="100%">
    <!-- Background for high contrast -->
    <rect width="100%" height="100%" fill="transparent"/>

    <!-- Main Geometry Framework Lines (Triangle ABC and North Arrow) -->
    <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Vertical North indicator axis line passing through point A -->
        <line x1="100" y1="240" x2="100" y2="60" />

        <!-- Upward facing arrowhead built manually to ensure reliable rendering direction -->
        <polygon points="100,50 90,68 110,68" fill="#ffffff" stroke="none" />

        <!-- Right-angled bearing triangle layout: A (100,160), B (440,160), C (440,300) -->
        <polygon points="100,160 440,160 440,300" />
    </g>

    <!-- Text Labels & Value Annotations Layout -->
    <g font-family="Arial, sans-serif" fill="#ffffff" font-weight="bold">
        <!-- North Indicator Text Header -->
        <text x="100" y="35" font-size="22" text-anchor="middle">North</text>

        <!-- Triangle Vertex Identification Labels -->
        <text x="80" y="168" font-size="24" text-anchor="end">A</text>
        <text x="455" y="165" font-size="24" text-anchor="start">B</text>
        <text x="440" y="330" font-size="24" text-anchor="middle">C</text>

        <!-- Side Length Value Constraints -->
        <text x="270" y="148" font-size="22" text-anchor="middle">12</text>
        <text x="270" y="225" font-size="22" text-anchor="middle">13</text>
        <text x="455" y="235" font-size="22" text-anchor="start">x</text>

        <!-- "NOT TO SCALE" Traditional Exam Paper Disclaimer text -->
        <g font-size="20" text-anchor="start" letter-spacing="1">
            <text x="560" y="80">NOT TO</text>
            <text x="560" y="105">SCALE</text>
        </g>
    </g>
</svg>