<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 180">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
        .degree-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; }
        .note-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; letter-spacing: 0.5px; }
    </style>

    <!-- "NOT TO SCALE" Note -->
    <text x="270" y="35" class="note-text">NOT TO</text>
    <text x="270" y="50" class="note-text">SCALE</text>

    <!-- Coordinates: P(30,150), Q(110,150), R(290,150), S(135,40) -->

    <!-- Base Line PQR -->
    <line x1="30" y1="150" x2="290" y2="150" class="geometry-line" />

    <!-- Left Side PS -->
    <line x1="30" y1="150" x2="135" y2="40" class="geometry-line" />

    <!-- Middle Line QS -->
    <line x1="110" y1="150" x2="135" y2="40" class="geometry-line" />

    <!-- Right Side RS -->
    <line x1="290" y1="150" x2="135" y2="40" class="geometry-line" />

    <!-- Angle QSR Arc (53°) -->
    <path d="M 129 65 A 28 28 0 0 0 156 55" class="geometry-line" />

    <!-- Dimension/Value Labels -->
    <text x="75" y="90" class="degree-text">15</text>
    <text x="126" y="105" class="degree-text">12</text>
    <text x="210" y="95" class="degree-text">17</text>
    <text x="142" y="65" class="degree-text">53°</text>

    <!-- Letter Labels for Vertices -->
    <text x="15" y="155" class="label-text">P</text>
    <text x="105" y="165" class="label-text">Q</text>
    <text x="295" y="155" class="label-text">R</text>
    <text x="132" y="32" class="label-text">S</text>
</svg>