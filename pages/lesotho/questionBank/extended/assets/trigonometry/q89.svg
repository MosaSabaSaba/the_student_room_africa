<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
        .degree-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; }
        .note-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; letter-spacing: 0.5px; }
    </style>

    <!-- "NOT TO SCALE" Note -->
    <text x="250" y="85" class="note-text">NOT TO</text>
    <text x="250" y="100" class="note-text">SCALE</text>

    <!-- Triangle Vertices: A(50,130), B(210,130), C(50,40) -->

    <!-- Base Line AB -->
    <line x1="50" y1="130" x2="210" y2="130" class="geometry-line" />

    <!-- Vertical Line AC -->
    <line x1="50" y1="40" x2="50" y2="130" class="geometry-line" />

    <!-- Hypotenuse Line CB -->
    <line x1="50" y1="40" x2="210" y2="130" class="geometry-line" />

    <!-- Right Angle Indicator at Vertex A -->
    <path d="M 50 120 L 60 120 L 60 130" class="geometry-line" />

    <!-- Side Length Text Labels -->
    <text x="120" y="145" class="degree-text">8 cm</text>
    <text x="135" y="78" class="degree-text">10 cm</text>

    <!-- Letter Labels for Vertices -->
    <text x="35" y="135" class="label-text">A</text>
    <text x="215" y="135" class="label-text">B</text>
    <text x="45" y="32" class="label-text">C</text>
</svg>