<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .geometry-line-dashed { stroke: #ffffff; stroke-width: 1.5; stroke-dasharray: 4; fill: none; }
        .arrowhead { fill: #ffffff; }
        .label-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
        .degree-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; }
        .note-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; letter-spacing: 0.5px; }
    </style>

    <!-- "NOT TO SCALE" Note -->
    <text x="260" y="35" class="note-text">NOT TO</text>
    <text x="260" y="50" class="note-text">SCALE</text>

    <!-- Coordinates: A(85,140), B(165,140), C(210,65), D(40,65) -->

    <!-- Outer Trapezium Lines -->
    <line x1="85" y1="140" x2="165" y2="140" class="geometry-line" /> <!-- AB -->
    <line x1="165" y1="140" x2="210" y2="65" class="geometry-line" />  <!-- BC -->
    <line x1="210" y1="65" x2="40" y2="65" class="geometry-line" />   <!-- CD -->
    <line x1="40" y1="65" x2="85" y2="140" class="geometry-line" />   <!-- DA -->

    <!-- Dashed Diagonal AC -->
    <line x1="85" y1="140" x2="210" y2="65" class="geometry-line-dashed" />

    <!-- Parallel Arrows -->
    <!-- Arrow on AB -->
    <polygon points="135,140 127,135 129,140 127,145" class="arrowhead" />
    <!-- Arrow on DC -->
    <polygon points="130,65 122,60 124,65 122,70" class="arrowhead" />

    <!-- Angle ABC Arc (120°) -->
    <path d="M 145 140 A 20 20 0 0 1 175 116" class="geometry-line" />

    <!-- Dimension/Value Labels -->
    <text x="115" y="158" class="degree-text">70 m</text>
    <text x="195" y="105" class="degree-text">79 m</text>
    <text x="145" y="132" class="degree-text">120°</text>

    <!-- Letter Labels for Vertices -->
    <text x="70" y="145" class="label-text">A</text>
    <text x="170" y="152" class="label-text">B</text>
    <text x="216" y="62" class="label-text">C</text>
    <text x="25" y="62" class="label-text">D</text>
</svg>