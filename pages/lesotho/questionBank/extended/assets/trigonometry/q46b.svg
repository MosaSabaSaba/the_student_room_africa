<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 200">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .geometry-line-dashed { stroke: #ffffff; stroke-width: 1.5; stroke-dasharray: 4; fill: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
        .degree-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; }
        .note-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; letter-spacing: 0.5px; }
    </style>

    <!-- "NOT TO SCALE" Note -->
    <text x="270" y="35" class="note-text">NOT TO</text>
    <text x="270" y="50" class="note-text">SCALE</text>

    <!-- Coordinates: Q(40,25), P(220,25), A(40,85), B(220,85), C(178,160), D(48,170) -->

    <!-- Top Rectangle ABPQ -->
    <line x1="40" y1="25" x2="220" y2="25" class="geometry-line" /> <!-- QP -->
    <line x1="40" y1="25" x2="40" y2="85" class="geometry-line" />  <!-- QA -->
    <line x1="220" y1="25" x2="220" y2="85" class="geometry-line" /> <!-- PB -->

    <!-- Bottom Quadrilateral Lines -->
    <line x1="40" y1="85" x2="220" y2="85" class="geometry-line" /> <!-- AB -->
    <line x1="220" y1="85" x2="178" y2="160" class="geometry-line-dashed" /> <!-- BC (Dashed) -->
    <line x1="178" y1="160" x2="48" y2="170" class="geometry-line" /> <!-- CD -->
    <line x1="48" y1="170" x2="40" y2="85" class="geometry-line" /> <!-- DA -->

    <!-- Diagonal Line AC -->
    <line x1="40" y1="85" x2="178" y2="160" class="geometry-line" />

    <!-- Angle BAC Arc (35°) -->
    <path d="M 75 85 A 35 35 0 0 1 69 105" class="geometry-line" />

    <!-- Right Angle Indicator at Vertex D -->
    <path d="M 47 160 L 57 159 L 58 169" class="geometry-line" />

    <!-- Dimension/Value Labels -->
    <text x="12" y="60" class="degree-text">2.2 m</text>
    <text x="125" y="78" class="degree-text">6 m</text>
    <text x="80" y="100" class="degree-text">35°</text>
    <text x="110" y="132" class="degree-text">2.2 m</text>
    <text x="105" y="186" class="degree-text">4.3 m</text>

    <!-- Letter Labels for Vertices -->
    <text x="23" y="25" class="label-text">Q</text>
    <text x="228" y="25" class="label-text">P</text>
    <text x="23" y="90" class="label-text">A</text>
    <text x="228" y="90" class="label-text">B</text>
    <text x="185" y="168" class="label-text">C</text>
    <text x="32" y="178" class="label-text">D</text>
</svg>