<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
        .degree-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; }
        .note-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; letter-spacing: 0.5px; }
    </style>

    <!-- "NOT TO SCALE" Note -->
    <text x="260" y="35" class="note-text">NOT TO</text>
    <text x="260" y="50" class="note-text">SCALE</text>

    <!-- Triangle Vertices: A(50,35), B(50,135), C(215,135), D(265,135) -->

    <!-- Base Line B-C-D -->
    <line x1="50" y1="135" x2="265" y2="135" class="geometry-line" />

    <!-- Vertical Line BA -->
    <line x1="50" y1="35" x2="50" y2="135" class="geometry-line" />

    <!-- Hypotenuse Line AC -->
    <line x1="50" y1="35" x2="215" y2="135" class="geometry-line" />

    <!-- Right Angle Indicator at Vertex B -->
    <path d="M 50 125 L 60 125 L 60 135" class="geometry-line" />

    <!-- Side Length Text Labels -->
    <text x="22" y="90" class="degree-text">5 cm</text>
    <text x="125" y="150" class="degree-text">12 cm</text>

    <!-- Letter Labels for Vertices -->
    <text x="35" y="32" class="label-text">A</text>
    <text x="35" y="148" class="label-text">B</text>
    <text x="210" y="148" class="label-text">C</text>
    <text x="260" y="148" class="label-text">D</text>
</svg>