<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200">
        <style>
            .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
            .geometry-line-dashed { stroke: #ffffff; stroke-width: 1.2; stroke-dasharray: 4, 4; fill: none; }
            .dimension-line { stroke: #ffffff; stroke-width: 1.0; fill: none; }
            .label-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
            .note-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; letter-spacing: 0.5px; }
        </style>

        <!-- Definitions for Dimension Arrows -->
        <defs>
            <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 5 0 L 0 8 L 10 8 z" fill="#ffffff" />
            </marker>
            <marker id="arrow-end" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 5 10 L 0 2 L 10 2 z" fill="#ffffff" />
            </marker>
        </defs>

        <!-- "NOT TO SCALE" Note -->
        <text x="270" y="45" class="note-text">NOT TO</text>
        <text x="270" y="60" class="note-text">SCALE</text>

        <!-- LEFT CONE -->
        <!-- Cone Tip (105, 52) -->
        <line x1="105" y1="52" x2="65" y2="130" class="geometry-line" />
        <line x1="105" y1="52" x2="145" y2="130" class="geometry-line" />
        <!-- Ellipse Base (Rx=40, Ry=16) -->
        <path d="M 65 130 A 40 16 0 0 0 145 130" class="geometry-line" />
        <path d="M 65 130 A 40 16 0 0 1 145 130" class="geometry-line-dashed" />

        <!-- Left Dimension Line (x cm) -->
        <line x1="45" y1="52" x2="45" y2="130" class="dimension-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
        <!-- Horizontal indicators -->
        <line x1="40" y1="52" x2="50" y2="52" class="dimension-line" />
        <line x1="40" y1="130" x2="50" y2="130" class="dimension-line" />
        <text x="22" y="95" class="label-text">x cm</text>


        <!-- RIGHT CONE -->
        <!-- Cone Tip (225, 38) -->
        <line x1="225" y1="38" x2="175" y2="130" class="geometry-line" />
        <line x1="225" y1="38" x2="275" y2="130" class="geometry-line" />
        <!-- Ellipse Base (Rx=50, Ry=20) -->
        <path d="M 175 130 A 50 20 0 0 0 275 130" class="geometry-line" />
        <path d="M 175 130 A 50 20 0 0 1 275 130" class="geometry-line-dashed" />

        <!-- Center Dimension Line (9 cm) -->
        <line x1="163" y1="38" x2="163" y2="130" class="dimension-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
        <!-- Horizontal indicators -->
        <line x1="158" y1="38" x2="168" y2="38" class="dimension-line" />
        <line x1="158" y1="130" x2="168" y2="130" class="dimension-line" />
        <text x="145" y="88" class="label-text">9 cm</text>
    </svg>