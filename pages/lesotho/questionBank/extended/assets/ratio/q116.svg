<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
        .degree-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; }
        .note-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; letter-spacing: 0.5px; }
    </style>

    <!-- "NOT TO SCALE" Note -->
    <text x="260" y="35" class="note-text">NOT TO</text>
    <text x="260" y="50" class="note-text">SCALE</text>

    <!-- Outer Triangle / Lines -->
    <!-- Line CA (Left side) -->
    <line x1="30" y1="175" x2="90" y2="45" class="geometry-line" />
    <!-- Line AB (Top horizontal side) -->
    <line x1="90" y1="45" x2="210" y2="45" class="geometry-line" />
    <!-- Line CB (Long diagonal side) -->
    <line x1="30" y1="175" x2="210" y2="45" class="geometry-line" />

    <!-- Interior Parallel Line DE -->
    <line x1="65" y1="100" x2="134" y2="100" class="geometry-line" />

    <!-- Parallel Arrowheads (>) -->
    <!-- Arrow on AB -->
    <path d="M 145,41 L 150,45 L 145,49" class="geometry-line" stroke-width="1.2" />
    <!-- Arrow on DE -->
    <path d="M 95,96 L 100,100 L 95,104" class="geometry-line" stroke-width="1.2" />

    <!-- Angle Arcs -->
    <!-- Arc at A (110°) -->
    <path d="M 81,68 A 25 25 0 0 0 112,56" class="geometry-line" />
    <text x="94" y="65" class="degree-text">110°</text>

    <!-- Arc at C (36°) -->
    <path d="M 44,145 A 35 35 0 0 1 58,155" class="geometry-line" />
    <text x="48" y="153" class="degree-text">36°</text>

    <!-- Letter Labels for Vertices -->
    <text x="80" y="40" class="label-text">A</text>
    <text x="216" y="49" class="label-text">B</text>
    <text x="22" y="190" class="label-text">C</text>
    <text x="50" y="104" class="label-text">D</text>
    <text x="142" y="105" class="label-text">E</text>
</svg>