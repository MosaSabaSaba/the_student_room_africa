<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
        .degree-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; }
        .note-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; letter-spacing: 0.5px; }
    </style>

    <!-- "NOT TO SCALE" Note -->
    <text x="285" y="35" class="note-text">NOT TO</text>
    <text x="285" y="50" class="note-text">SCALE</text>

    <!-- Main Geometry Circle -->
    <circle cx="125" cy="95" r="65" class="geometry-line" />

    <!-- Center Point O and Radii Lines -->
    <!-- Line OD -->
    <line x1="125" y1="95" x2="68" y2="65" class="geometry-line" />
    <!-- Line OB -->
    <line x1="125" y1="95" x2="182" y2="65" class="geometry-line" />

    <!-- Inscribed Quadrilateral Chords -->
    <!-- Chord AD -->
    <line x1="125" y1="30" x2="68" y2="65" class="geometry-line" />
    <!-- Chord AB -->
    <line x1="125" y1="30" x2="182" y2="65" class="geometry-line" />
    <!-- Chord DC -->
    <line x1="68" y1="65" x2="95" y2="154" class="geometry-line" />
    <!-- Chord BC -->
    <line x1="182" y1="65" x2="95" y2="154" class="geometry-line" />

    <!-- Angle 124 Arc at Center O -->
    <path d="M 112 88 A 15 15 0 0 1 138 88" class="geometry-line" />
    <text x="114" y="83" class="degree-text">124&#176;</text>

    <!-- Letter Labels (Vertices and Center) with clear padding -->
    <text x="121" y="24" class="label-text">A</text>
    <text x="187" y="68" class="label-text">B</text>
    <text x="89" y="167" class="label-text">C</text>
    <text x="54" y="68" class="label-text">D</text>
    <text x="121" y="111" class="label-text">O</text>
</svg>