<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
    <!-- Background for high contrast -->
    <rect width="100%" height="100%" fill="transparent"/>

    <!-- Tangent Lines Framework and Right Angle -->
    <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Horizontal base tangent line running from P through C to Q -->
        <line x1="80" y1="390" x2="490" y2="390" />
        
        <!-- Vertical tangent line running straight up from Q through D -->
        <line x1="490" y1="390" x2="490" y2="50" />

        <!-- Perpendicular square right angle indicator at vertex Q -->
        <rect x="472" y="372" width="18" height="18" stroke-width="2.5"/>
    </g>

    <!-- Main Circle Geometry and Central Radii -->
    <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Perfect circle frame centered at (340, 240) with radius 150 -->
        <circle cx="340" cy="240" r="150" />

        <!-- Radius lines connecting Center O to vertices A and C -->
        <!-- Center O: (340, 240), A: (280, 99), C (Bottom Tangency Point): (340, 390) -->
        <line x1="340" y1="240" x2="340" y2="390" /> <!-- Radius OC -->
        <line x1="340" y1="240" x2="280" y2="99" />  <!-- Radius OA -->
    </g>

    <!-- Cyclic Inscribed Perimeter Chords (All vertices perfectly anchor to the circle perimeter) -->
    <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <!-- 
            Grounding Coordinates mapped to align exactly on the circle circumference boundary path:
            A (Top Left-ish):   (280, 99)
            B (Far Left Node):   (191.5, 226)  Fixed to stay exactly on the circle line boundary
            C (Bottom Centre):  (340, 390)
            D (Far Right Node):  (490, 240)
        -->
        <line x1="280" y1="99" x2="191.5" y2="226" />   <!-- Chord AB -->
        <line x1="191.5" y1="226" x2="340" y2="390" />  <!-- Chord BC -->
        <line x1="340" y1="390" x2="490" y2="240" />  <!-- Chord CD -->
        <line x1="490" y1="240" x2="280" y2="99" />   <!-- Chord DA -->
    </g>

    <!-- Angle Arc Markers matching your layout exactly -->
    <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
        <!-- 94° Interior Angle Arc at vertex B (between chords BA and BC) -->
        <path d="M 213,200 A 35,35 0 0,1 215,254" />
        
        <!-- 50° Alternate Segment Theorem Angle Arc at bottom vertex C (between chord BC and tangent line PC) -->
        <path d="M 295,390 A 45,45 0 0,1 313,352" />
    </g>

    <!-- Text and Value Annotations Layout -->
    <g font-family="Arial, sans-serif" fill="#ffffff" font-weight="bold">
        <!-- Mathematical Point Reference Labels -->
        <text x="275" y="85" font-size="24" text-anchor="middle">A</text>
        <text x="170" y="230" font-size="24" text-anchor="end">B</text>
        <text x="340" y="420" font-size="24" text-anchor="middle">C</text>
        <text x="510" y="250" font-size="24" text-anchor="start">D</text>
        <text x="360" y="245" font-size="24" text-anchor="start">O</text>
        <text x="95" y="415" font-size="24" text-anchor="middle">P</text>
        <text x="495" y="415" font-size="24" text-anchor="start">Q</text>

        <!-- Angle Numerical Value Text Labels -->
        <text x="212" y="232" font-size="18" text-anchor="middle">94°</text>
        <text x="270" y="370" font-size="18" text-anchor="middle">50°</text>

        <!-- "NOT TO SCALE" Traditional Exam Paper Disclaimer text -->
        <g font-size="20" text-anchor="start" letter-spacing="1">
            <text x="560" y="150">NOT TO</text>
            <text x="560" y="178">SCALE</text>
        </g>
    </g>
</svg>