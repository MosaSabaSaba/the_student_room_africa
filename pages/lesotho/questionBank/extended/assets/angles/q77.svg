<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="100%" height="100%">
    <!-- Background for high contrast -->
    <rect width="100%" height="100%" fill="transparent"/>

    <!-- Main Sector Geometry -->
    <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Radius line OB -->
        <line x1="200" y1="240" x2="110" y2="105" />
        
        <!-- Radius line OA -->
        <line x1="200" y1="240" x2="365" y2="160" />
        
        <!-- Circular Arc from B to A (Radius = 183.1) -->
        <path d="M 110,105 A 183.1,183.1 0 0,1 365,160" />
        
        <!-- Center point dot O -->
        <circle cx="200" cy="240" r="5" fill="#ffffff" stroke="none"/>
    </g>

    <!-- Text and Labels -->
    <g font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff">
        <!-- Vertex Labels -->
        <text x="200" y="270" font-size="22" text-anchor="middle">O</text>
        <text x="95" y="105" font-size="22" text-anchor="end">B</text>
        <text x="385" y="165" font-size="22" text-anchor="start">A</text>

        <!-- Measurement Label on Radius OA -->
        <text x="295" y="220" font-size="20" text-anchor="middle">6 cm</text>

        <!-- "NOT TO SCALE" Disclaimer -->
        <g font-size="20" text-anchor="start" letter-spacing="1">
            <text x="560" y="120">NOT TO</text>
            <text x="560" y="145">SCALE</text>
        </g>
    </g>
</svg>