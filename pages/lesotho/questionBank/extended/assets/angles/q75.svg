<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="100%" height="100%">
    <!-- Background for high contrast -->
    <rect width="100%" height="100%" fill="transparent"/>

    <!-- Main Geometry Lines Group -->
    <g stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round">
        <!-- Main Triangle Outer Frame Line Side CB -->
        <line x1="120" y1="280" x2="430" y2="60" />
        
        <!-- Line Side CA extending past D to A -->
        <line x1="120" y1="280" x2="220" y2="60" />

        <!-- Top Parallel Horizontal Line AB -->
        <line x1="220" y1="60" x2="430" y2="60" />

        <!-- Middle Parallel Horizontal Segment DE -->
        <line x1="170" y1="170" x2="275" y2="170" />

        <!-- Angle Arcs Indicators -->
        <g stroke-width="2">
            <!-- 110 degree interior angle arc at vertex A -->
            <path d="M 205,93 A 35,35 0 0,0 255,60" />
            
            <!-- Noticeably larger, high-visibility 36 degree angle arc at vertex C -->
            <path d="M 148,220 A 70,70 0 0,1 175,242" />
        </g>
    </g>

    <!-- Prominent Standard Geometry Chevron/Arrow Overlays directly on lines AB and DE -->
    <g stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Arrowhead on line AB -->
        <path d="M 315,52 L 325,60 L 315,68" />
        
        <!-- Arrowhead on line DE -->
        <path d="M 235,162 L 245,170 L 235,178" />
    </g>

    <!-- Text and Labels -->
    <g font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff">
        <!-- Intersection Vertex Labels -->
        <text x="210" y="52" font-size="22" text-anchor="middle">A</text>
        <text x="445" y="65" font-size="22" text-anchor="start">B</text>
        <text x="110" y="302" font-size="22" text-anchor="middle">C</text>
        <text x="150" y="175" font-size="22" text-anchor="end">D</text>
        <text x="330" y="178" font-size="22" text-anchor="start">E</text>

        <!-- Angle Numerical Values Strings -->
        <text x="230" y="92" font-size="18" text-anchor="middle">110°</text>
        <text x="175" y="215" font-size="18" text-anchor="middle">36°</text>

        <!-- "NOT TO SCALE" Disclaimer -->
        <g font-size="20" text-anchor="start" letter-spacing="1">
            <text x="560" y="80">NOT TO</text>
            <text x="560" y="105">SCALE</text>
        </g>
    </g>
</svg>