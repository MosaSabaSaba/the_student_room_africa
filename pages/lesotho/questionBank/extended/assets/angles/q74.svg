<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400">
    <!-- Background for high contrast -->
    <rect width="100%" height="100%" fill="transparent"/>

    <!-- Main Circle Geometry and Cyclic Chords -->
    <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Main circle centered at (270, 200) with radius 140 -->
        <circle cx="270" cy="200" r="140" />
        
        <!-- Diameter line segment AB -->
        <line x1="130" y1="200" x2="410" y2="200" />
        
        <!-- Extension line from vertex B to exterior point E -->
        <line x1="410" y1="200" x2="630" y2="200" />
        
        <!-- Exterior line from E passing through C and D -->
        <line x1="630" y1="200" x2="200" y2="61" />

        <!-- Inscribed Chords connecting points inside the circle -->
        <!-- Triangle ADF & Chord DF -->
        <line x1="130" y1="200" x2="218" y2="69" />
        <line x1="218" y1="69" x2="310" y2="335" />
        
        <!-- Chords from C to F and B to F -->
        <line x1="384" y1="130" x2="310" y2="335" />
        <line x1="410" y1="200" x2="310" y2="335" />
        
        <!-- Main Chord DB (forming the triangle with double ticks) -->
        <line x1="218" y1="69" x2="410" y2="200" />
    </g>

    <!-- Center Point, Angle Arc, and Congruency Tick Marks -->
    <g stroke="#ffffff" stroke-width="2.5" fill="none">
        <!-- Circle center dot -->
        <circle cx="270" cy="200" r="5" fill="#ffffff" />

        <!-- Double congruency ticks on line segment DB -->
        <line x1="305" y1="123" x2="315" y2="138" />
        <line x1="310" y1="120" x2="320" y2="135" />

        <!-- Double congruency ticks on exterior segment BE -->
        <line x1="515" y1="190" x2="515" y2="210" />
        <line x1="522" y1="190" x2="522" y2="210" />

        <!-- Angle Arc at vertex E (18°) -->
        <path d="M 570,200 A 60,60 0 0,0 575,178" />
    </g>

    <!-- Text Labels & Values Descriptions -->
    <g font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff">
        <!-- Geometric Vertices Labels -->
        <text x="110" y="208" font-size="22" text-anchor="middle">A</text>
        <text x="420" y="218" font-size="22" text-anchor="start">B</text>
        <text x="398" y="120" font-size="22" text-anchor="start">C</text>
        <text x="218" y="50" font-size="22" text-anchor="middle">D</text>
        <text x="650" y="208" font-size="22" text-anchor="start">E</text>
        <text x="310" y="365" font-size="22" text-anchor="middle">F</text>

        <!-- Angle Numerical Label -->
        <text x="550" y="170" font-size="18" text-anchor="middle">18°</text>

        <!-- "NOT TO SCALE" Disclaimer -->
        <g font-size="20" text-anchor="start" letter-spacing="1">
            <text x="600" y="80">NOT TO</text>
            <text x="600" y="105">SCALE</text>
        </g>
    </g>
</svg>