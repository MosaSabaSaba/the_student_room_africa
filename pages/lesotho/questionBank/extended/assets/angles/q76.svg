<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="100%" height="100%">
    <!-- Background for high contrast -->
    <rect width="100%" height="100%" fill="transparent"/>

    <!-- Main Circle and Geometric Chords/Tangents -->
    <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Circle centered at (200, 140) with a radius of 90 -->
        <circle cx="200" cy="140" r="90" />
        
        <!-- Tangent line segment from point T to point P -->
        <line x1="200" y1="230" x2="560" y2="230" />
        
        <!-- Line segment connecting center O to external point P -->
        <line x1="200" y1="140" x2="560" y2="230" />
        
        <!-- Vertical chord inside the circle (length 8 cm) -->
        <line x1="260" y1="73" x2="260" y2="207" />
        
        <!-- Perpendicular line segment from O to the chord (length 3 cm) -->
        <line x1="200" y1="140" x2="260" y2="140" />
    </g>

    <!-- Right-angle indicator on the chord-to-center line -->
    <rect x="250" y="140" width="10" height="10" fill="none" stroke="#ffffff" stroke-width="2" />

    <!-- Text and Labels -->
    <g font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff">
        <!-- Vertex and Point Labels -->
        <text x="180" y="145" font-size="22" text-anchor="middle">O</text>
        <text x="200" y="255" font-size="22" text-anchor="middle">T</text>
        <text x="575" y="238" font-size="22" text-anchor="start">P</text>

        <!-- Measurement Dimension Labels -->
        <text x="230" y="132" font-size="18" text-anchor="middle">3 cm</text>
        <text x="380" y="255" font-size="22" text-anchor="middle">12 cm</text>
        
        <!-- Chord label rotated vertically along the line -->
        <text x="270" y="140" font-size="18" text-anchor="middle" transform="rotate(-90 278 140)">8 cm</text>
    </g>
</svg>