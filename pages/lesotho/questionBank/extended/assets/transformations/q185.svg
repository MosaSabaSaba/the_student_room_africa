        <text x="228" y="204" class="axis-text">2</text>
        <text x="228" y="234" class="axis-text">1</text>
        <text x="228" y="294" class="axis-text">-1</text>
        <text x="228" y="324" class="axis-text">-2</text>
        <text x="228" y="354" class="axis-text">-3</text>
        <text x="228" y="384" class="axis-text">-4</text>
        <text x="228" y="414" class="axis-text">-5</text>
        <text x="228" y="444" class="axis-text">-6</text>
        <text x="228" y="474" class="axis-text">-7</text>
        <text x="228" y="504" class="axis-text">-8</text>

        <!-- 4. Geometric Shapes Layout -->
        <!-- Shape A: Vertices at (-4,4), (-3,5), (-2,5), (-1,4) -->
        <polygon points="120,140 150,110 180,110 210,140" class="shape-line" />
        <text x="165" y="132" class="shape-label">A</text>

        <!-- Shape B: Vertices at (-4,-1), (-5,-2), (-5,-3), (-4,-4) -->
        <polygon points="120,290 90,320 90,350 120,380" class="shape-line" />
        <text x="108" y="340" class="shape-label">B</text>
    </svg>