<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540">
        <style>
            .grid-major { stroke: #555555; stroke-width: 1.0; fill: none; }
            .grid-minor { stroke: #333333; stroke-width: 0.5; fill: none; }
            .axis-line { stroke: #ffffff; stroke-width: 2.0; fill: none; }
            .shape-line { stroke: #ffffff; stroke-width: 2.5; fill: none; stroke-linejoin: round; stroke-linecap: round; }
            .axis-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
            .axis-label { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 16px; font-weight: bold; fill: #ffffff; }
            .shape-label { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
        </style>

        <!-- Definitions for Axis Arrowheads -->
        <defs>
            <marker id="axis-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 2 L 8 5 L 0 8 z" fill="#ffffff" stroke="none" />
            </marker>
        </defs>

        <!-- 1. Grid Lines (Centered at x=240, y=260, 30 units per major grid square, 6 units per minor division) -->
        <!-- Minor Grid Lines -->
        <g class="grid-minor">
            <!-- Vertical Minor Lines -->
            <path d="M 36,20 L 36,500 M 42,20 L 42,500 M 48,20 L 48,500 M 54,20 L 54,500
                    M 66,20 L 66,500 M 72,20 L 72,500 M 78,20 L 78,500 M 84,20 L 84,500
                    M 96,20 L 96,500 M 102,20 L 102,500 M 108,20 L 108,500 M 114,20 L 114,500
                    M 126,20 L 126,500 M 132,20 L 132,500 M 138,20 L 138,500 M 144,20 L 144,500
                    M 156,20 L 156,500 M 162,20 L 162,500 M 168,20 L 168,500 M 174,20 L 174,500
                    M 186,20 L 186,500 M 192,20 L 192,500 M 198,20 L 198,500 M 204,20 L 204,500
                    M 216,20 L 216,500 M 222,20 L 222,500 M 228,20 L 228,500 M 234,20 L 234,500
                    M 246,20 L 246,500 M 252,20 L 252,500 M 258,20 L 258,500 M 264,20 L 264,500
                    M 276,20 L 276,500 M 282,20 L 282,500 M 288,20 L 288,500 M 294,20 L 294,500
                    M 306,20 L 306,500 M 312,20 L 312,500 M 318,20 L 318,500 M 324,20 L 324,500
                    M 336,20 L 336,500 M 342,20 L 342,500 M 348,20 L 348,500 M 354,20 L 354,500
                    M 366,20 L 366,500 M 372,20 L 372,500 M 378,20 L 378,500 M 384,20 L 384,500
                    M 396,20 L 396,500 M 402,20 L 402,500 M 408,20 L 408,500 M 414,20 L 414,500
                    M 426,20 L 426,500 M 432,20 L 432,500 M 438,20 L 438,500 M 444,20 L 444,500
                    M 456,20 L 456,500 M 462,20 L 462,500 M 468,20 L 468,500 M 474,20 L 474,500
                    M 486,20 L 486,500 M 492,20 L 492,500 M 498,20 L 498,500 M 504,20 L 504,500" />
            <!-- Horizontal Minor Lines -->
            <path d="M 30,500 L 510,500 M 30,494 L 510,494 M 30,488 L 510,488 M 30,482 L 510,482
                    M 30,470 L 510,470 M 30,464 L 510,464 M 30,458 L 510,458 M 30,452 L 510,452
                    M 30,440 L 510,440 M 30,434 L 510,434 M 30,428 L 510,428 M 30,422 L 510,422
                    M 30,410 L 510,410 M 30,404 L 510,404 M 30,398 L 510,398 M 30,392 L 510,392
                    M 30,380 L 510,380 M 30,374 L 510,374 M 30,368 L 510,368 M 30,362 L 510,362
                    M 30,350 L 510,350 M 30,344 L 510,344 M 30,338 L 510,338 M 30,332 L 510,332
                    M 30,320 L 510,320 M 30,314 L 510,314 M 30,308 L 510,308 M 30,302 L 510,302
                    M 30,290 L 510,290 M 30,284 L 510,284 M 30,278 L 510,278 M 30,272 L 510,272
                    M 30,248 L 510,248 M 30,242 L 510,242 M 30,236 L 510,236 M 30,230 L 510,230
                    M 30,218 L 510,218 M 30,212 L 510,212 M 30,206 L 510,206 M 30,200 L 510,200
                    M 30,188 L 510,188 M 30,182 L 510,182 M 30,176 L 510,176 M 30,170 L 510,170
                    M 30,158 L 510,158 M 30,152 L 510,152 M 30,146 L 510,146 M 30,140 L 510,140
                    M 30,128 L 510,128 M 30,122 L 510,122 M 30,126 L 510,126 M 30,120 L 510,120
                    M 30,108 L 510,108 M 30,102 L 510,102 M 30,96 L 510,96 M 30,90 L 510,90
                    M 30,78 L 510,78 M 30,72 L 510,72 M 30,66 L 510,66 M 30,60 L 510,60
                    M 30,48 L 510,48 M 30,42 L 510,42 M 30,36 L 510,36 M 30,30 L 510,30" />
        </g>

        <!-- Major Grid Lines -->
        <g class="grid-major">
            <!-- Vertical Grid Lines from -7 to 7 -->
            <path d="M 30,20 L 30,500 M 60,20 L 60,500 M 90,20 L 90,500 M 120,20 L 120,500 
                    M 150,20 L 150,500 M 180,20 L 180,500 M 210,20 L 210,500 M 270,20 L 270,500 
                    M 300,20 L 300,500 M 330,20 L 330,500 M 360,20 L 360,500 M 390,20 L 390,500 
                    M 420,20 L 420,500 M 450,20 L 450,500 M 480,20 L 480,500 M 510,20 L 510,500" />
            <!-- Horizontal Grid Lines from -8 to 8 -->
            <path d="M 30,20 L 510,20 M 30,50 L 510,50 M 30,80 L 510,80 M 30,110 L 510,110 
                    M 30,140 L 510,140 M 30,170 L 510,170 M 30,200 L 510,200 M 30,230 L 510,230 
                    M 30,290 L 510,290 M 30,320 L 510,320 M 30,350 L 510,350 M 30,380 L 510,380 
                    M 30,410 L 510,410 M 30,440 L 510,440 M 30,470 L 510,470 M 30,500 L 510,500" />
        </g>

        <!-- 2. Axis Lines with Arrowheads -->
        <!-- X Axis -->
        <line x1="20" y1="260" x2="520" y2="260" class="axis-line" marker-end="url(#axis-arrow)" />
        <!-- Y Axis -->
        <line x1="240" y1="520" x2="240" y2="20" class="axis-line" marker-end="url(#axis-arrow)" />

        <!-- Axis Labels -->
        <text x="532" y="264" class="axis-label">x</text>
        <text x="240" y="13" class="axis-label" text-anchor="middle">y</text>

        <!-- 3. Tick Number Labels -->
        <!-- X-Axis Ticks -->
        <text x="60" y="275" class="axis-text">-6</text>
        <text x="90" y="275" class="axis-text">-5</text>
        <text x="120" y="275" class="axis-text">-4</text>
        <text x="150" y="275" class="axis-text">-3</text>
        <text x="180" y="275" class="axis-text">-2</text>
        <text x="210" y="275" class="axis-text">-1</text>
        <text x="252" y="275" class="axis-text">0</text>
        <text x="270" y="275" class="axis-text">1</text>
        <text x="300" y="275" class="axis-text">2</text>
        <text x="330" y="275" class="axis-text">3</text>
        <text x="360" y="275" class="axis-text">4</text>
        <text x="390" y="275" class="axis-text">5</text>
        <text x="420" y="275" class="axis-text">6</text>

        <!-- Y-Axis Ticks -->
        <text x="228" y="84" class="axis-text">6</text>
        <text x="228" y="114" class="axis-text">5</text>
        <text x="228" y="144" class="axis-text">4</text>
