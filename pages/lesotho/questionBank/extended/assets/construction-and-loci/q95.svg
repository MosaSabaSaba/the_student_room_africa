<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .dashed-line { stroke: #ffffff; stroke-width: 1.5; stroke-dasharray: 4, 3; fill: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
    </style>

    <!-- Triangle Vertices: A(120,25), B(45,155), C(305,155) -->

    <!-- Base Line BC -->
    <line x1="45" y1="155" x2="305" y2="155" class="geometry-line" />

    <!-- Left Side Line BA (Solid) -->
    <line x1="45" y1="155" x2="120" y2="25" class="geometry-line" />

    <!-- Right Side Line AC (Dashed) -->
    <line x1="120" y1="25" x2="305" y2="155" class="dashed-line" />

    <!-- Letter Labels for Vertices -->
    <text x="115" y="19" class="label-text">A</text>
    <text x="32" y="159" class="label-text">B</text>
    <text x="310" y="159" class="label-text">C</text>
</svg>