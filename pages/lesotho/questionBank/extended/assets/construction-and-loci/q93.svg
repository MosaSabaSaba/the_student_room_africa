<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
    </style>

    <!-- Triangle Vertices: R(170,30), T(25,150), S(315,150) -->

    <!-- Base Line TS -->
    <line x1="25" y1="150" x2="315" y2="150" class="geometry-line" />

    <!-- Left Side Line TR -->
    <line x1="25" y1="150" x2="170" y2="30" class="geometry-line" />

    <!-- Right Side Line SR -->
    <line x1="315" y1="150" x2="170" y2="30" class="geometry-line" />

    <!-- Letter Labels for Vertices -->
    <text x="165" y="24" class="label-text">R</text>
    <text x="13" y="154" class="label-text">T</text>
    <text x="319" y="154" class="label-text">S</text>
</svg>