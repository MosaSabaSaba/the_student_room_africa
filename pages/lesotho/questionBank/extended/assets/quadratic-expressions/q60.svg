<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280">
    <!-- Background for high contrast -->
    <rect width="100%" height="100%" fill="transparent"/>

    <!-- Main Geometry Right-Angled Triangle Group -->
    <g stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Triangle XYZ -->
        <polygon points="120,40 120,220 520,220" />
        
        <!-- Right Angle Indicator Box at vertex Y -->
        <rect x="120" y="202" width="18" height="18" />
    </g>

    <!-- Text and Labels -->
    <g font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff">
        <!-- Vertex Labels -->
        <text x="120" y="30" font-size="24" text-anchor="middle">X</text>
        <text x="100" y="235" font-size="24" text-anchor="middle">Y</text>
        <text x="535" y="235" font-size="24" text-anchor="middle">Z</text>

        <!-- Side Length Labels -->
        <text x="90" y="135" font-size="26" text-anchor="end">(x + 5)</text>
        <text x="320" y="245" font-size="26" text-anchor="middle">4x</text>

        <!-- "NOT TO SCALE" Disclaimer -->
        <g font-size="20" text-anchor="start" letter-spacing="1">
            <text x="560" y="80">NOT TO</text>
            <text x="560" y="105">SCALE</text>
        </g>
    </g>
</svg>