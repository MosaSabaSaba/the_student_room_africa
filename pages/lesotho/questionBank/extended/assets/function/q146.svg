<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240">
    <style>
        .grid-line { stroke: #ffffff; stroke-width: 0.8; stroke-dasharray: 2, 2; opacity: 0.5; fill: none; }
        .axis-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .geometry-line { stroke: #ffffff; stroke-width: 2.0; fill: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
        .math-text { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 13px; font-weight: bold; fill: #ffffff; }
    </style>

    <!-- Definitions for Axes Arrowheads -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 2 L 8 5 L 0 8 z" fill="#ffffff" />
        </marker>
    </defs>

    <!-- PERFECT UNIFORM GRID (30px per square = 0.5 units on both axes) -->
    <!-- Vertical Grid Lines (x = -1.0, -0.5, 0, 0.5, 1.0, 1.5, 2.0) -->
    <line x1="30" y1="20" x2="30" y2="220" class="grid-line" />
    <line x1="60" y1="20" x2="60" y2="220" class="grid-line" />
    <line x1="90" y1="20" x2="90" y2="220" class="grid-line" />
    <line x1="120" y1="20" x2="120" y2="220" class="grid-line" />
    <line x1="150" y1="20" x2="150" y2="220" class="grid-line" />
    <line x1="180" y1="20" x2="180" y2="220" class="grid-line" />
    <line x1="210" y1="20" x2="210" y2="220" class="grid-line" />
    <line x1="240" y1="20" x2="240" y2="220" class="grid-line" />

    <!-- Horizontal Grid Lines (y = 2.0, 1.5, 1.0, 0.5, 0, -0.5, -1.0) -->
    <line x1="20" y1="30" x2="250" y2="30" class="grid-line" />
    <line x1="20" y1="60" x2="250" y2="60" class="grid-line" />
    <line x1="20" y1="90" x2="250" y2="90" class="grid-line" />
    <line x1="20" y1="120" x2="250" y2="120" class="grid-line" />
    <line x1="20" y1="150" x2="250" y2="150" class="grid-line" />
    <line x1="20" y1="180" x2="250" y2="180" class="grid-line" />
    <line x1="20" y1="210" x2="250" y2="210" class="grid-line" />

    <!-- COORDINATE AXES -->
    <!-- X-Axis (at y = 150) -->
    <line x1="15" y1="150" x2="265" y2="150" class="axis-line" marker-end="url(#arrow)" />
    <text x="274" y="154" class="math-text">x</text>
    
    <!-- Y-Axis (at x = 90) -->
    <line x1="90" y1="225" x2="90" y2="15" class="axis-line" marker-end="url(#arrow)" />
    <text x="90" y="8" class="math-text">y</text>

    <!-- GEOMETRY LINE l (y = 2x + 1) -->
    <!-- Perfectly linear vector intersecting (-0.5, 0) and (0, 1) under the strict uniform grid scale -->
    <line x1="18" y1="234" x2="126" y2="18" class="geometry-line" />
    <text x="134" y="24" class="math-text">l</text>

    <!-- AXIS LABELS AND TICKS (Perfectly Uniformly Placed) -->
    <!-- Origin Label -->
    <text x="82" y="162" class="label-text">0</text>
    
    <!-- X-Axis Labels -->
    <text x="30" y="162" class="label-text">-1</text>
    <text x="150" y="162" class="label-text">1</text>
    <text x="210" y="162" class="label-text">2</text>
    
    <!-- Y-Axis Labels (Corrected to match the exact uniform 60px/unit scale) -->
    <text x="82" y="214" class="label-text">-1</text>
    <text x="82" y="94" class="label-text">1</text>
    <text x="82" y="34" class="label-text">2</text>
</svg>