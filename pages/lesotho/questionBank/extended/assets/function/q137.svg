<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .axis-line { stroke: #ffffff; stroke-width: 1.5; fill: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; }
        .math-text { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 13px; font-weight: bold; fill: #ffffff; }
        .note-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; letter-spacing: 0.5px; }
    </style>

    <!-- Definitions for Arrowheads -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 2 L 8 5 L 0 8 z" fill="#ffffff" />
        </marker>
    </defs>

    <!-- "NOT TO SCALE" Note -->
    <text x="270" y="45" class="note-text">NOT TO</text>
    <text x="270" y="60" class="note-text">SCALE</text>

    <!-- COORDINATE AXES -->
    <!-- X-Axis (y = 130) -->
    <line x1="30" y1="130" x2="260" y2="130" class="axis-line" marker-end="url(#arrow)" />
    <text x="267" y="134" class="math-text">x</text>
    
    <!-- Y-Axis (x = 70) -->
    <line x1="70" y1="215" x2="70" y2="35" class="axis-line" marker-end="url(#arrow)" />
    <text x="66" y="26" class="math-text">y</text>
    
    <!-- Origin Label -->
    <text x="55" y="142" class="label-text">O</text>

    <!-- GEOMETRY LINES -->
    <!-- Main Line passing through A(70,58), B(140,106), C(175,130) -->
    <line x1="45" y1="41" x2="220" y2="161" class="geometry-line" />
    
    <!-- Line segment OB from Origin (70,130) to B(140,106) -->
    <line x1="70" y1="130" x2="140" y2="106" class="geometry-line" />
    
    <!-- Line segment DC from D(70,166) to C(175,130) -->
    <line x1="70" y1="166" x2="175" y2="130" class="geometry-line" />

    <!-- POINT LABELS AND COORDINATES -->
    <!-- Point A & y-intercept 9 -->
    <text x="78" y="54" class="math-text">A</text>
    <text x="58" y="62" class="label-text">9</text>
    
    <!-- Point B & Coordinates (2, 3) -->
    <text x="135" y="98" class="math-text">B</text>
    <text x="162" y="98" class="label-text">(2, 3)</text>
    
    <!-- Point C -->
    <text x="182" y="124" class="math-text">C</text>
    
    <!-- Point D & Coordinates (0, −4½) -->
    <text x="72" y="182" class="math-text">D</text>
    <text x="110" y="182" class="label-text">(0, −4½)</text>
</svg>