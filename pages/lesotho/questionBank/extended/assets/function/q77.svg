<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 680" width="440" height="680" >
    <style>
        .axis-line { stroke: #ffffff; stroke-width: 2; }
        .major-grid { stroke: #555555; stroke-width: 1; }
        .minor-grid { stroke: #333333; stroke-width: 0.5; }
        .axis-text { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
        .axis-text-left { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; text-anchor: end; }
    </style>

    <!-- Background -->
    <rect width="440" height="680" fill="transparent" />

