<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; stroke-linejoin: round; }
        .dashed-line { stroke: #ffffff; stroke-width: 1.2; stroke-dasharray: 4, 4; fill: none; }
        .dimension-line { stroke: #ffffff; stroke-width: 1.0; fill: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
        .note-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; letter-spacing: 0.5px; }
    </style>

    <!-- Definitions for Dimension Arrows -->
    <defs>
        <marker id="arrow-start" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 10 0 L 0 5 L 10 10 z" fill="#ffffff" />
        </marker>
        <marker id="arrow-end" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff" />
        </marker>
    </defs>

    <!-- "NOT TO SCALE" Note -->
    <text x="295" y="45" class="note-text" text-anchor="start">NOT TO</text>
    <text x="295" y="60" class="note-text" text-anchor="start">SCALE</text>

    <!-- Trapezoidal Prism Outline -->
    <!-- Front Face Vertices: Base-Left(30,165), Base-Right(195,165), Top-Right(155,95), Top-Left(75,95) -->
    <polygon points="30,165 195,165 155,95 75,95" class="geometry-line" />
    
    <!-- Top Face Extension to Back Wall: Top-Back-Right(245,45), Top-Back-Left(165,45) -->
    <polygon points="75,95 165,45 245,45 155,95" class="geometry-line" />
    
    <!-- Right Slanted Side Extension to Base-Back-Right(285,115) -->
    <polygon points="155,95 245,45 285,115 195,165" class="geometry-line" />

    <!-- Height Line (Dashed) inside the front face -->
    <line x1="155" y1="95" x2="155" y2="165" class="dashed-line" />
    
    <!-- Right Angle Indicator Box at base of height line -->
    <rect x="147" y="157" width="8" height="8" class="geometry-line" stroke-width="1.0" />

    <!-- Dimension Arrow for the base line (22 cm) -->
    <line x1="30" y1="175" x2="195" y2="175" class="dimension-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />

    <!-- Text Labels -->
    <text x="115" y="90" class="label-text">20 cm</text>
    <text x="135" y="132" class="label-text">12 cm</text>
    <text x="112" y="160" class="label-text">22 cm</text>
    <text x="255" y="138" class="label-text">40 cm</text>
</svg>