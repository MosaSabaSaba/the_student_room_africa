<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .label-text { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
        .note-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; letter-spacing: 0.5px; }
    </style>

    <!-- "NOT TO SCALE" Note -->
    <text x="260" y="55" class="note-text">NOT TO</text>
    <text x="260" y="70" class="note-text">SCALE</text>

    <!-- SMALL MUG -->
    <!-- Handle -->
    <path d="M 85 105 A 12 12 0 0 1 85 125" class="geometry-line" />
    <!-- Mug Body Base -->
    <path d="M 55 133 Q 55 137 59 137 L 81 137 Q 85 137 85 133" class="geometry-line" />
    <!-- Mug Body Sides -->
    <line x1="55" y1="95" x2="55" y2="133" class="geometry-line" />
    <line x1="85" y1="95" x2="85" y2="133" class="geometry-line" />
    <!-- Top Rim Rim -->
    <ellipse cx="70" cy="95" rx="15" ry="7" class="geometry-line" />
    <!-- Text Label -->
    <text x="70" y="162" class="label-text">Small mug</text>


    <!-- LARGE MUG -->
    <!-- Handle -->
    <path d="M 185 85 A 18 18 0 0 1 185 120" class="geometry-line" />
    <!-- Mug Body Base -->
    <path d="M 135 131 Q 135 137 141 137 L 179 137 Q 185 137 185 131" class="geometry-line" />
    <!-- Mug Body Sides -->
    <line x1="135" y1="65" x2="135" y2="131" class="geometry-line" />
    <line x1="185" y1="65" x2="185" y2="131" class="geometry-line" />
    <!-- Top Rim Rim -->
    <ellipse cx="160" cy="65" rx="25" ry="11" class="geometry-line" />
    <!-- Text Label -->
    <text x="160" y="162" class="label-text">Large mug</text>
</svg>