<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200">
    <style>
        .geometry-line { stroke: #ffffff; stroke-width: 1.5; fill: none; stroke-linejoin: round; }
        .angle-arc { stroke: #ffffff; stroke-width: 1.0; fill: none; }
        .label-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
        .box-border { stroke: #ffffff; stroke-width: 1.2; fill: none; }
    </style>

    <!-- Top Sector Surface -->
    <!-- Center vertex is at (130, 65) -->
    <!-- Left edge ends at (175, 20) -->
    <!-- Right curved edge spans to (280, 45) -->
    <path d="M 130 65 L 175 20 A 110 40 0 0 1 280 45 Z" class="geometry-line" stroke-width="1.5"></path>

    <!-- Front Flat Side Facade Vertical Extrusions -->
    <!-- Left vertical corner edge -->
    <line x1="130" y1="65" x2="125" y2="180" class="geometry-line"></line>
    
    <!-- Right vertical corner edge -->
    <line x1="280" y1="45" x2="272" y2="155" class="geometry-line"></line>
    
    <!-- Bottom Straight Base Line (Corrected from curve) -->
    <line x1="125" y1="180" x2="272" y2="155" class="geometry-line"></line>

    <!-- Interior Sector Angle Double Arcs -->
    <path d="M 144 51 A 20 20 0 0 1 149 61" class="angle-arc"></path>
    <path d="M 149 46 A 25 25 0 0 1 154 59" class="angle-arc"></path>

    <!-- Component Text Surface Labels -->
    <text x="180" y="45" class="label-text" style="font-size: 11px;">Top</text>
    <text x="165" y="125" class="label-text">side</text>

    <!-- Dimension Metrics Labels -->
    <text x="100" y="32" class="label-text">20 cm</text>
    <text x="290" y="115" class="label-text">24 cm</text>

    <!-- Exterior 45 Degree Value Pointer and Box -->
    <line x1="133" y1="58" x2="95" y2="70" class="angle-arc"></line>
    <rect x="45" y="55" width="45" height="26" class="box-border"></rect>
    <text x="52" y="73" class="label-text">45°</text>
</svg>