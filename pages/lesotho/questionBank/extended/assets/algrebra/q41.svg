<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
    <!-- Background for high contrast -->
    <rect width="100%" height="100%" fill="transparent"/>

    <!-- Main Scale Geometry -->
    <g fill="none" stroke="#ffffff">
        <!-- Outer boundary arc of the dial gauge -->
        <path d="M 150,320 A 200,200 0 0,1 550,320" stroke-width="4"/>
        
        <!-- Center base pivot marker point -->
        <circle cx="350" cy="320" r="10" fill="#ffffff" stroke="none"/>
    </g>

    <!-- Scale Tick Marks (Exactly 21 total marks / 20 subdivisions from 0 to 180 degrees) -->
    <g stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round">
        <!-- 1st Tick (0) - 180 deg -->
        <line x1="150" y1="320" x2="170" y2="320"/>
        <!-- 2nd Tick - 171 deg -->
        <line x1="152.4" y1="288.7" x2="172.2" y2="291.8"/>
        <!-- 3rd Tick - 162 deg -->
        <line x1="159.5" y1="258.1" x2="178.6" y2="264.3"/>
        <!-- 4th Tick - 153 deg -->
        <line x1="171.3" y1="229.1" x2="189.1" y2="238.2"/>
        <!-- 5th Tick - 144 deg -->
        <line x1="187.4" y1="202.3" x2="203.6" y2="214.1"/>
        <!-- 6th Tick - 135 deg -->
        <line x1="208.6" y1="178.6" x2="222.7" y2="192.7"/>
        <!-- 7th Tick - 126 deg -->
        <line x1="233.9" y1="158.4" x2="245.6" y2="174.6"/>
        <!-- 8th Tick - 117 deg -->
        <line x1="262.7" y1="142.2" x2="271.8" y2="160.0"/>
        <!-- 9th Tick - 108 deg -->
        <line x1="294.3" y1="130.3" x2="300.5" y2="149.3"/>
        <!-- 10th Tick - 99 deg -->
        <line x1="328.1" y1="122.7" x2="331.2" y2="142.5"/>
        
        <!-- 11th Tick (Middle / Center) - 90 deg -->
        <line x1="350" y1="120" x2="350" y2="140"/>
        
        <!-- 12th Tick - 81 deg -->
        <line x1="371.9" y1="122.7" x2="368.8" y2="142.5"/>
        <!-- 13th Tick (9th from the right) - 72 deg -->
        <line x1="405.7" y1="130.3" x2="399.5" y2="149.3"/>
        <!-- 14th Tick - 63 deg -->
        <line x1="437.3" y1="142.2" x2="428.2" y2="160.0"/>
        <!-- 15th Tick - 54 deg -->
        <line x1="466.1" y1="158.4" x2="454.4" y2="174.6"/>
        <!-- 16th Tick - 45 deg -->
        <line x1="491.4" y1="178.6" x2="477.3" y2="192.7"/>
        <!-- 17th Tick - 36 deg -->
        <line x1="512.6" y1="202.3" x2="496.4" y2="214.1"/>
        <!-- 18th Tick - 27 deg -->
        <line x1="528.7" y1="229.1" x2="510.9" y2="238.2"/>
        <!-- 19th Tick - 18 deg -->
        <line x1="540.5" y1="258.1" x2="521.4" y2="264.3"/>
        <!-- 20th Tick - 9 deg -->
        <line x1="547.6" y1="288.7" x2="527.8" y2="291.8"/>
        <!-- 21st Tick (2x) - 0 deg -->
        <line x1="550" y1="320" x2="530" y2="320"/>
    </g>

    <!-- Dial Pointer Indicator (Pointing precisely to the 13th tick/9th from the right at 72 degrees) -->
    <g stroke="#ffffff" stroke-width="5" fill="#ffffff" stroke-linecap="round">
        <line x1="350" y1="320" x2="399.5" y2="148"/>
        <!-- Clean geometric arrow tip pointing right along the vector line -->
        <polygon points="402,141 388,153 397,156"/>
    </g>

    <!-- Text Labels & Values Descriptions -->
    <g font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff" font-size="34">
        <!-- Start point label value -->
        <text x="115" y="335" text-anchor="middle">0</text>
        
        <!-- End point label value -->
        <text x="590" y="335" text-anchor="middle">2x</text>
    </g>
</svg>