<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 680">
    <style>
        .grid-minor { fill: none; stroke: #bcbcbc; stroke-width: 0.5; }
        .grid-medium { fill: none; stroke: #767676; stroke-width: 0.9; }
        .grid-major { fill: none; stroke: #ffffff; stroke-width: 1.4; }
        .axis-line { fill: none; stroke: #ffffff; stroke-width: 2.2; }
        .curve-path { fill: none; stroke: #fafafa; stroke-width: 3.2; stroke-linecap: round; }
        .text-label { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #ffffff; text-anchor: middle; }
        .text-axis-title { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #ffffff; font-weight: bold; text-anchor: middle; }
        .text-axis-vertical { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #ffffff; font-weight: bold; text-anchor: middle; transform: rotate(-90deg); }
        .axis-arrow { fill: #ffffff; }
    </style>
    
    <rect width="520" height="680" fill="transparent" />

    <!-- ==================== PERFECT GRID SYSTEM ====================
        Origin (0,0) starts at Pixel (80, 590).
        The grid is exactly 50 small squares wide (0 to 100 marks, 2 units per square)
        and 80 small squares high (0 to 800 cumulative frequency, 10 units per square).
        Each small square is exactly 7px by 7px.
        Width = 50 * 7 = 350px  -> Grid extends from X=80 to X=430.
        Height = 80 * 7 = 560px -> Grid extends from Y=590 up to Y=30.
    -->
    
    <!-- 1. Minor Grid Lines (Every single unit square) -->
    <g class="grid-minor">
        <!-- Vertical minor lines (except medium and major positions) -->
        <path d="
            M87,30 v560 M94,30 v560 M101,30 v560 M108,30 v560 M122,30 v560 M129,30 v560 M136,30 v560 M143,30 v560
            M157,30 v560 M164,30 v560 M171,30 v560 M178,30 v560 M192,30 v560 M199,30 v560 M206,30 v560 M213,30 v560
            M227,30 v560 M234,30 v560 M241,30 v560 M248,30 v560 M262,30 v560 M269,30 v560 M276,30 v560 M283,30 v560
            M297,30 v560 M304,30 v560 M311,30 v560 M318,30 v560 M332,30 v560 M339,30 v560 M346,30 v560 M353,30 v560
            M367,30 v560 M374,30 v560 M381,30 v560 M388,30 v560 M402,30 v560 M409,30 v560 M416,30 v560 M423,30 v560
        " />
        <!-- Horizontal minor lines -->
        <path d="
            M80,583 h350 M80,576 h350 M80,569 h350 M80,562 h350 M80,548 h350 M80,541 h350 M80,534 h350 M80,527 h350
            M80,513 h350 M80,506 h350 M80,499 h350 M80,492 h350 M80,478 h350 M80,471 h350 M80,464 h350 M80,457 h350
            M80,443 h350 M80,436 h350 M80,429 h350 M80,422 h350 M80,408 h350 M80,401 h350 M80,394 h350 M80,387 h350
            M80,373 h350 M80,366 h350 M80,359 h350 M80,352 h350 M80,338 h350 M80,331 h350 M80,324 h350 M80,317 h350
            M80,303 h350 M80,296 h350 M80,289 h350 M80,282 h350 M80,268 h350 M80,261 h350 M80,254 h350 M80,247 h350
            M80,233 h350 M80,226 h350 M80,219 h350 M80,212 h350 M80,198 h350 M80,191 h350 M80,184 h350 M80,177 h350
            M80,163 h350 M80,156 h350 M80,149 h350 M80,142 h350 M80,128 h350 M80,121 h350 M80,114 h350 M80,107 h350
            M80,93  h350 M80,86  h350 M80,79  h350 M80,72  h350 M80,58  h350 M80,51  h350 M80,44  h350 M80,37  h350
        " />
    </g>

    <!-- 2. Medium Grid Lines (Every 10 units on X, 50 units on Y) -->
    <g class="grid-medium">
        <!-- Vertical medium lines (10, 30, 50, 70, 90) -->
        <path d="M115,30 v560 M185,30 v560 M255,30 v560 M325,30 v560 M395,30 v560" />
        <!-- Horizontal medium lines (50, 150, 250, 350, 450, 550, 650, 750) -->
        <path d="M80,555 h350 M80,485 h350 M80,415 h350 M80,345 h350 M80,275 h350 M80,205 h350 M80,135 h350 M80,65 h350" />
    </g>

    <!-- 3. Major Grid Lines (Every 20 units on X, 100 units on Y) -->
    <g class="grid-major">
        <!-- Vertical major lines (20, 40, 60, 80, 100) -->
        <path d="M150,30 v560 M220,30 v560 M290,30 v560 M360,30 v560 M430,30 v560" />
        <!-- Horizontal major lines (100, 200, 300, 400, 500, 600, 700, 800) -->
        <path d="M80,520 h350 M80,450 h350 M80,380 h350 M80,310 h350 M80,240 h350 M80,170 h350 M80,100 h350 M80,30 h350" />
    </g>

    <!-- ==================== AXES WITH ARROWS ==================== -->
    <!-- Y-axis line -->
    <line x1="80" y1="590" x2="80" y2="15" class="axis-line" />
    <path d="M80,10 L75,25 L85,25 Z" class="axis-arrow" />
    
    <!-- X-axis line -->
    <line x1="80" y1="590" x2="455" y2="590" class="axis-line" />
    <path d="M460,590 L445,585 L445,595 Z" class="axis-arrow" />

    <!-- ==================== TYPOGRAPHY LABELS ==================== -->
    <!-- Y-Axis Values -->
    <text x="55" y="596" class="text-label">0</text>
    <text x="50" y="526" class="text-label">100</text>
    <text x="50" y="456" class="text-label">200</text>
    <text x="50" y="386" class="text-label">300</text>
    <text x="50" y="316" class="text-label">400</text>
    <text x="50" y="246" class="text-label">500</text>
    <text x="50" y="176" class="text-label">600</text>
    <text x="50" y="106" class="text-label">700</text>
    <text x="50" y="36"  class="text-label">800</text>

    <!-- X-Axis Values -->
    <text x="150" y="618" class="text-label">20</text>
    <text x="220" y="618" class="text-label">40</text>
    <text x="290" y="618" class="text-label">60</text>
    <text x="360" y="618" class="text-label">80</text>
    <text x="430" y="618" class="text-label">100</text>

    <!-- Axis Labels -->
    <text x="-240" y="24" class="text-axis-vertical">Cumulative</text>
    <text x="-240" y="48" class="text-axis-vertical">Frequency</text>
    <text x="495" y="596" class="text-axis-title">Mark</text>

    <!-- ==================== CUMULATIVE FREQUENCY OGVVE CURVE ==================== -->
    <!-- Smoothly passing through verified key target intersections:
        (0,0)    -> (80, 590)
        (20,30)  -> (150, 569)
        (40,150) -> (220, 485)
        (60,460) -> (290, 268)
        (80,740) -> (360, 72)
        (100,800)-> (430, 30)
    -->
    <path d="M 80,590 
            C 105,590, 130,580, 150,569
            C 180,550, 205,520, 220,485
            C 245,430, 270,330, 290,268
            C 315,190, 340,110, 360,72
            C 380,38,  405,30,  430,30" class="curve-path" />
</svg>