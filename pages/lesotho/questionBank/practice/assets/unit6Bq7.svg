<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 680">
    <style>
        .grid-minor { fill: none; stroke: #bcbcbc; stroke-width: 0.5; }
        .grid-medium { fill: none; stroke: #767676; stroke-width: 0.9; }
        .grid-major { fill: none; stroke: #ffffff; stroke-width: 1.4; }
        .axis-line { fill: none; stroke: #ffffff; stroke-width: 2.2; }
        .curve-path { fill: none; stroke: #ffffff; stroke-width: 3.0; stroke-linecap: round; stroke-linejoin: round; }
        .text-label { font-family: Arial, Helvetica, sans-serif; font-size: 22px; fill: #ffffff; text-anchor: middle; }
        .text-axis-title { font-family: Arial, Helvetica, sans-serif; font-size: 24px; fill: #ffffff; font-weight: bold; text-anchor: middle; }
        .text-axis-vertical { font-family: Arial, Helvetica, sans-serif; font-size: 24px; fill: #ffffff; font-weight: bold; text-anchor: middle; transform: rotate(-90deg); }
    </style>
    
    <rect width="540" height="680" fill="transparent" />

    <!-- ==================== PERFECT GRID SYSTEM ==================== -->
    <!-- 1. Minor Grid Lines (Every single unit square) -->
    <g class="grid-minor">
        <path d="
            M98,30 v560 M106,30 v560 M114,30 v560 M122,30 v560 M138,30 v560 M146,30 v560 M154,30 v560 M162,30 v560
            M178,30 v560 M186,30 v560 M194,30 v560 M202,30 v560 M218,30 v560 M226,30 v560 M234,30 v560 M242,30 v560
            M258,30 v560 M266,30 v560 M274,30 v560 M282,30 v560 M298,30 v560 M306,30 v560 M314,30 v560 M322,30 v560
            M338,30 v560 M346,30 v560 M354,30 v560 M362,30 v560 M378,30 v560 M386,30 v560 M394,30 v560 M402,30 v560
            M418,30 v560 M426,30 v560 M434,30 v560 M442,30 v560 M458,30 v560 M466,30 v560 M474,30 v560 M482,30 v560
        " />
        <path d="
            M90,582 h400 M90,574 h400 M90,566 h400 M90,558 h400 M90,542 h400 M90,534 h400 M90,526 h400 M90,518 h400
            M90,502 h400 M90,494 h400 M90,486 h400 M90,478 h400 M90,462 h400 M90,454 h400 M90,446 h400 M90,438 h400
            M90,422 h400 M90,414 h400 M90,406 h400 M90,398 h400 M90,382 h400 M90,374 h400 M90,366 h400 M90,358 h400
            M90,342 h400 M90,334 h400 M90,326 h400 M90,318 h400 M90,302 h400 M90,294 h400 M90,286 h400 M90,278 h400
            M90,262 h400 M90,254 h400 M90,246 h400 M90,238 h400 M90,222 h400 M90,214 h400 M90,206 h400 M90,198 h400
            M90,182 h400 M90,174 h400 M90,166 h400 M90,158 h400 M90,142 h400 M90,134 h400 M90,126 h400 M90,118 h400
            M90,102 h400 M90,94 h400 M90,86 h400 M90,78 h400 M90,62 h400 M90,54 h400 M90,46 h400 M90,38 h400
        " />
    </g>

    <!-- 2. Medium Grid Lines (Every 5 units on X, 50 units on Y) -->
    <g class="grid-medium">
        <path d="M130,30 v560 M210,30 v560 M290,30 v560 M370,30 v560 M450,30 v560" />
        <path d="M90,550 h400 M90,470 h400 M90,390 h400 M90,310 h400 M90,230 h400 M90,150 h400 M90,70 h400" />
    </g>

    <!-- 3. Major Grid Lines (Every 10 units on X, 100 units on Y) -->
    <g class="grid-major">
        <path d="M170,30 v560 M250,30 v560 M330,30 v560 M410,30 v560" />
        <path d="M90,510 h400 M90,430 h400 M90,350 h400 M90,270 h400 M90,190 h400 M90,110 h400" />
    </g>

    <!-- ==================== AXIS BORDERS ==================== -->
    <path d="M90,30 v560 h400 v-560 z" fill="none" stroke="#ffffff" stroke-width="2.2" />

    <!-- ==================== TYPOGRAPHY LABELS ==================== -->
    <text x="60" y="597" class="text-label">0</text>
    <text x="50" y="517" class="text-label">100</text>
    <text x="50" y="437" class="text-label">200</text>
    <text x="50" y="357" class="text-label">300</text>
    <text x="50" y="277" class="text-label">400</text>
    <text x="50" y="197" class="text-label">500</text>
    <text x="50" y="117" class="text-label">600</text>
    <text x="50" y="37"  class="text-label">700</text>

    <text x="90"  y="622" class="text-label">0</text>
    <text x="170" y="622" class="text-label">10</text>
    <text x="250" y="622" class="text-label">20</text>
    <text x="330" y="622" class="text-label">30</text>
    <text x="410" y="622" class="text-label">40</text>
    <text x="490" y="622" class="text-label">50</text>

    <text x="-310" y="28" class="text-axis-vertical">Cumulative Frequency</text>
    <text x="290" y="660" class="text-axis-title">Distance in metres</text>

    <!-- ==================== CUMULATIVE FREQUENCY OGVVE CURVE ==================== -->
    <!-- Calibrated cubic Bezier links ensuring a perfectly fluid line that passes exactly through our verified pixel intersections:
        (0,0)   -> (90, 590)
        (10,50)  -> (170, 550)
        (15,120) -> (210, 494)
        (20,200) -> (250, 430)
        (24,300) -> (282, 350)
        (30,440) -> (330, 238)
        (40,595) -> (410, 114)
        (50,640) -> (490, 78)
    -->
    <path d="M 90,590 
            C 115,587, 145,572, 170,550
            C 185,536, 200,516, 210,501
            C 223,476, 238,457, 250,430
            C 262,403, 274,374, 282,350
            C 294,320, 314,272, 330,238
            C 354,192, 386,134, 410,114
            C 434,94,  466,84,  490,78" class="curve-path" />
</svg>